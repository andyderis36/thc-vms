# CI: satu file, dua gerbang. Push TIDAK memicu apa pun (direct push ke `dev`
# tanpa CI — disengaja agar satu-satunya sinyal adalah PR).
#   PR ke `dev`   -> job changes (deteksi path) + job *-quick yang jalurnya
#                    tersentuh (build+vet, lint+typecheck). Tanpa test/build.
#   PR ke `main`  -> job backend/frontend full suite (termasuk next build).
#   merge ke main -> deploy.yml deploys; file ini tidak deploy.
#   dispatch      -> full suite manual.
#
# Aturan main ("dev PRs are advisory, dev->main PR is the gate"): hanya gate
# PR ke `main` yang wajib hijau (branch protection); gate PR ke `dev` adalah
# sinyal review, bukan penghalang merge.
#
# Playwright E2E is intentionally not run on the VPS runner; run it locally
# against deploy/ci/compose.ci.yml when needed.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# The single existing runner (self-hosted/linux/vps) is shared with production,
# so runs are serialized instead of cancelled mid-suite.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  # Security scans live in security.yml (advisory, manual-only) so known
  # baseline findings cannot block the dev -> main flow.
  # Deteksi path yang tersentuh PR vs base-nya. Gagal-aman: bila fetch/diff
  # gagal, kedua sisi dianggap tersentuh (job jalan, bukan skip).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, vps]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        run: |
          base_ref="${{ github.base_ref }}"
          backend=1
          frontend=1
          if git fetch origin "$base_ref" --depth=100 >/dev/null 2>&1 \
            && git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
            touched="$(git diff --name-only "origin/$base_ref...HEAD" 2>/dev/null || true)"
            backend=0
            frontend=0
            if printf '%s\n' "$touched" | grep -qE '^(backend/|\.gitea/|deploy/|docker-compose[^/]*\.ya?ml$|.*Dockerfile$|.*Caddyfile$|caddy/)'; then
              backend=1
            fi
            if printf '%s\n' "$touched" | grep -qE '^(frontend/|\.gitea/|deploy/|docker-compose[^/]*\.ya?ml$|.*Dockerfile$|.*Caddyfile$|caddy/)'; then
              frontend=1
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    # Full suite: hanya gate PR ke `main` + dispatch manual.
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    # Move CI jobs to a dedicated [self-hosted, linux, ci] runner when available;
    # deploy stays on [self-hosted, linux, vps].
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # No caching: this runner has no guaranteed cache service.
          cache: false

      - name: Build
        working-directory: backend
        run: timeout 300 go build ./...

      - name: Vet
        working-directory: backend
        run: timeout 180 go vet ./...

      - name: Start PostgreSQL
        run: bash .gitea/scripts/ci-pg.sh start

      - name: Prepare scratch database
        run: bash .gitea/scripts/ci-pg.sh prepare

      - name: Test
        working-directory: backend
        env:
          CI: "true"
          THC_VMS_TEST_DSN: postgres://thc_user:thc_password_local@localhost:5432/thc_vms_t03_test?sslmode=disable
        run: |
          # Re-check right before the suite: the container can die between steps.
          bash ../.gitea/scripts/ci-pg.sh prepare
          # Serial packages (-p 1): this runner is shared with production and
          # parallel packages exhaust the local Postgres connection budget
          # (repository concurrency tests fail with begin-tx timeouts).
          timeout 1800 go test ./... -count=1 -p 1 -coverprofile=coverage.out

      - name: Guard against false green
        # The repository harness exits 0 when Postgres is unreachable. If no
        # transaction was committed, the integration tests silently skipped.
        run: |
          after=$(bash .gitea/scripts/ci-pg.sh counter)
          before=$(tr -d '[:space:]' < /tmp/xact_before)
          echo "xact_commit before=${before} after=${after}"
          if [ "${after:-0}" -le "${before:-0}" ]; then
            echo "FAIL: no database transaction ran; integration tests were skipped." >&2
            exit 1
          fi

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-pg >/dev/null 2>&1 || true

      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  frontend:
    # Full suite: hanya gate PR ke `main` + dispatch manual.
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 membutuhkan node ^22.12 || ^24 || >=26.
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        # Cache persisten di host runner (/tmp bertahan antar-run di host yang
        # sama): run kedua dst. memakai `--prefer-offline` sehingga jarang unduh
        # ulang. `npm cache verify` menyembuhkan korupsi index (akar masalah
        # "poisoned shared cache" dulu) tanpa menghapus semuanya tiap run.
        # Bila 3x tetap gagal, cache di-nuke sekali sebagai jalan terakhir.
        run: |
          cache_dir="${RUNNER_TEMP:-/tmp}/npm-cache-thc"
          mkdir -p "$cache_dir"
          npm cache verify --cache "$cache_dir" >/dev/null 2>&1 || true
          npm_ci() {
            timeout 600 npm ci --cache "$cache_dir" --no-audit --no-fund \
              --prefer-offline --fetch-retries=3 \
              --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=60000
          }
          for attempt in 1 2 3; do
            if npm_ci; then
              exit 0
            fi
            echo "npm ci failed (attempt ${attempt}/3), retrying..." >&2
            sleep 15
          done
          echo "npm ci gagal 3x dengan cache persisten — coba sekali tanpa cache..." >&2
          rm -rf "$cache_dir"
          mkdir -p "$cache_dir"
          npm_ci

      - name: Upload npm debug logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs
          if-no-files-found: ignore

      - name: Lint
        working-directory: frontend
        run: timeout 180 npm run lint

      - name: Typecheck
        working-directory: frontend
        run: timeout 180 npm run typecheck

      - name: Unit tests
        working-directory: frontend
        # Vitest's default parallelism over-spawns workers on this runner; the
        # single-worker run is the stable baseline.
        run: timeout 600 npm test -- --maxWorkers=1

      - name: Build
        # Job ini hanya jalan untuk base `main`/dispatch (lihat `if` job),
        # jadi build final selalu ikut di sini.
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        run: timeout 600 npm run build

  # Quick check PR ke `dev`: umpan balik menit-an tanpa test/build. Hanya jalan
  # bila jalurnya tersentuh (lihat job changes); PR docs-only hijau instan.
  backend-quick:
    needs: [changes]
    if: github.base_ref == 'dev' && needs.changes.outputs.backend == '1'
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build
        working-directory: backend
        run: timeout 300 go build ./...

      - name: Vet
        working-directory: backend
        run: timeout 180 go vet ./...

  frontend-quick:
    needs: [changes]
    if: github.base_ref == 'dev' && needs.changes.outputs.frontend == '1'
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        # Cache persisten yang sama seperti job frontend (lihat komentar di
        # sana): verify tiap run, nuke hanya sebagai jalan terakhir.
        run: |
          cache_dir="${RUNNER_TEMP:-/tmp}/npm-cache-thc"
          mkdir -p "$cache_dir"
          npm cache verify --cache "$cache_dir" >/dev/null 2>&1 || true
          npm_ci() {
            timeout 600 npm ci --cache "$cache_dir" --no-audit --no-fund \
              --prefer-offline --fetch-retries=3 \
              --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=60000
          }
          for attempt in 1 2 3; do
            if npm_ci; then
              exit 0
            fi
            echo "npm ci failed (attempt ${attempt}/3), retrying..." >&2
            sleep 15
          done
          echo "npm ci gagal 3x dengan cache persisten — coba sekali tanpa cache..." >&2
          rm -rf "$cache_dir"
          mkdir -p "$cache_dir"
          npm_ci

      - name: Lint
        working-directory: frontend
        run: timeout 180 npm run lint

      - name: Typecheck
        working-directory: frontend
        run: timeout 180 npm run typecheck
