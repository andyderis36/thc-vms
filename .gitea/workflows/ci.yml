# CI for the dev -> PR -> main -> deploy flow:
#   1. push to `dev`          -> this workflow runs.
#   2. blocking checks green -> open PR `dev` -> `main`.
#   3. PR targets `main`      -> this workflow runs again on the PR head.
#   4. required checks green  -> merge the PR (branch protection enforces them).
#   5. merge pushes `main`    -> deploy.yml deploys; this file never deploys.
# There is no tag trigger and no feature-branch-to-dev requirement: only pushes
# to `dev` and PRs targeting `main` are validated.
#
# Playwright E2E is intentionally not run on the VPS runner; run it locally
# against deploy/ci/compose.ci.yml when needed.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The single existing runner (self-hosted/linux/vps) is shared with production,
# so runs are serialized instead of cancelled mid-suite.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  # Security scans live in security.yml (advisory, manual/scheduled) so known
  # baseline findings cannot block the dev -> main flow.
  backend:
    # Move CI jobs to a dedicated [self-hosted, linux, ci] runner when available;
    # deploy stays on [self-hosted, linux, vps].
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # No caching: this runner has no guaranteed cache service.
          cache: false

      - name: Build
        working-directory: backend
        run: timeout 300 go build ./...

      - name: Vet
        working-directory: backend
        run: timeout 180 go vet ./...

      - name: Start PostgreSQL
        run: |
          docker rm -f ci-pg >/dev/null 2>&1 || true
          docker run -d --name ci-pg \
            -p 5432:5432 \
            -e POSTGRES_USER=thc_user \
            -e POSTGRES_PASSWORD=thc_password_local \
            -e POSTGRES_DB=thc_vms_db \
            postgres:18-alpine
          for i in $(seq 1 60); do
            if docker exec ci-pg pg_isready -U thc_user -d thc_vms_db >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready" >&2
          docker logs ci-pg >&2 || true
          exit 1

      - name: Prepare scratch database
        run: |
          docker exec ci-pg psql -U thc_user -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='thc_vms_t03_test'" | grep -q 1 \
            || docker exec ci-pg psql -U thc_user -d postgres -c \
              "CREATE DATABASE thc_vms_t03_test"
          # Read the counter from the maintenance DB so this probe's own
          # transaction is never counted against the scratch database.
          docker exec ci-pg psql -U thc_user -d postgres -tAc \
            "SELECT xact_commit FROM pg_stat_database WHERE datname='thc_vms_t03_test'" \
            | tr -d '[:space:]' > /tmp/xact_before
          echo "xact_commit before: $(cat /tmp/xact_before)"

      - name: Test
        working-directory: backend
        env:
          CI: "true"
          THC_VMS_TEST_DSN: postgres://thc_user:thc_password_local@localhost:5432/thc_vms_t03_test?sslmode=disable
        run: timeout 900 go test ./... -count=1 -coverprofile=coverage.out

      - name: Guard against false green
        # The repository harness exits 0 when Postgres is unreachable. If no
        # transaction was committed, the integration tests silently skipped.
        run: |
          after=$(docker exec ci-pg psql -U thc_user -d postgres -tAc \
            "SELECT xact_commit FROM pg_stat_database WHERE datname='thc_vms_t03_test'" \
            | tr -d '[:space:]')
          before=$(tr -d '[:space:]' < /tmp/xact_before)
          echo "xact_commit before=${before} after=${after}"
          if [ "${after:-0}" -le "${before:-0}" ]; then
            echo "FAIL: no database transaction ran; integration tests were skipped." >&2
            exit 1
          fi

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-pg >/dev/null 2>&1 || true

      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  frontend:
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: timeout 600 npm ci

      - name: Lint
        working-directory: frontend
        run: timeout 180 npm run lint

      - name: Typecheck
        working-directory: frontend
        run: timeout 180 npm run typecheck

      - name: Unit tests
        working-directory: frontend
        # Vitest's default parallelism over-spawns workers on this runner; the
        # single-worker run is the stable baseline (60 files / 758 tests).
        run: timeout 600 npm test -- --maxWorkers=1

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        run: timeout 600 npm run build
