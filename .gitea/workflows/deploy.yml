# THC-VMS production deploy.
# Runs ONLY on a push to `main` - i.e. after the PR `dev` -> `main` has been
# merged and that merge commit is pushed. There is no tag trigger: releases are
# not deployed by tag. `dev` never deploys; pushes to `dev` only run ci.yml.
# The Gitea Actions self-hosted runner on the Ubuntu VPS (labels below must
# match) executes deploy/deploy.sh, which self-pulls latest main before deploying.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# Serialize deploys; never cancel one midway (deploy.sh mutates the live stack).
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, vps]
    steps:
      - name: Deploy latest main on VPS
        # Panggil lewat `bash`, bukan eksekusi langsung: file script tidak
        # selalu punya bit executable di index git (mode 100644), dan eksekusi
        # langsung file 644 berakhir "Permission denied" (exit 126).
        run: bash /home/vms/thc-vms/deploy/deploy.sh
