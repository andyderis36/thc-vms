# Advisory security scans, manual-only. This is deliberately NOT a merge gate
# and NOT scheduled: the current baseline has known findings (govulncheck
# melaporkan 19 kerentanan pada Nov 2026, mayoritas stdlib net/http via
# toolchain go1.26.5), so blocking or weekly red noise would freeze/desensitize
# the dev -> main flow. Run manually before dependency upgrades; promote these
# steps into ci.yml only after the dependency baseline is clean.
name: security

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Govulncheck
        working-directory: backend
        run: |
          timeout 600 go install golang.org/x/vuln/cmd/govulncheck@latest
          timeout 600 "$(go env GOPATH)/bin/govulncheck" ./...

      - name: npm audit
        working-directory: frontend
        run: timeout 300 npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        run: |
          touch .trivyignore
          timeout 900 docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest \
            fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --ignorefile .trivyignore \
            --skip-dirs node_modules --skip-dirs .next .

      - name: Syft SBOM
        run: |
          timeout 900 docker run --rm -v "$PWD:/src" -w /src anchore/syft:latest \
            dir:. -o cyclonedx-json=sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30
