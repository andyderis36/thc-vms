# deploy/ci/compose.ci.yml - stack E2E untuk CI (bukan produksi).
# Jalankan: docker compose -p thc-vms-ci -f deploy/ci/compose.ci.yml up -d --build
# Tidak ada Caddy: port host dipublikasikan langsung, dan itu disengaja.
# Semua kredensial di sini dummy dan aman dikomit.
name: thc-vms-ci

services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: thc_user
      POSTGRES_PASSWORD: thc_password_local
      POSTGRES_DB: thc_vms_db
    volumes:
      - pgdata_ci:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thc_user -d thc_vms_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Tanpa port host: hanya migrate/seed/backend yang butuh, via DNS compose.
    # Job integration-test memakai Postgres-nya sendiri (lihat 5.A.4).

  minio:
    image: ghcr.io/netvark/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    environment:
      MINIO_ROOT_USER: thc_minio_ci
      MINIO_ROOT_PASSWORD: thc_minio_password_ci
    command: server /data
    volumes:
      - miniodata_ci:/data
    # Port host wajib: browser/Playwright butuh URL storage absolut.
    # Console tidak dipublikasikan (tidak ada yang memakainya di CI).
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["./migrate"]
    env_file:
      - .env.ci
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["./seeds"]
    env_file:
      - .env.ci
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env.ci
    environment:
      # Limiter dimatikan: suite E2E login berkali-kali dari satu IP.
      AUTH_RATE_LIMIT: "-1"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:13210
      # Nama env yang benar ada di config.go adalah S3_*, bukan MINIO_*.
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_BASE_URL: http://127.0.0.1:19000/thc-vms-bucket
    ports:
      - "18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Backend resolve role `security` saat boot; tanpa seed ia exit 1.
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18080/api/v1
    restart: "no"
    ports:
      - "13210:3210"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  # Ephemeral. `down -v` menghapus keduanya; tidak ada data yang perlu disimpan.
  pgdata_ci:
  miniodata_ci:
