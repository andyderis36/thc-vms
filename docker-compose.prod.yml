# THC-VMS production stack for VPS — self-contained (infra + app).
# Secrets: ONE file, repo-root `.env` (cp .env.prod.example .env, fill CHANGEME).
# Never commit `.env`. Start: docker compose -f docker-compose.prod.yml up -d --build
# Order is deterministic: postgres healthy -> migrate (one-shot) -> backend -> frontend -> caddy.
# Caddy adalah reverse proxy TUNGGAL (:80): /api ke backend, /s3 ke object storage,
# sisanya ke frontend. Database & object storage tidak dipublikasikan ke host.
name: thc-vms-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    # Resource cap (non-swarm, single-instance).
    mem_limit: 1G
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage S3-compatible. MinIO = stack yang sama dengan local dev
  # (AGENTS.md §4). Default di-pin ke digest: repo minio/minio di Docker Hub
  # sudah dihapus, dan ghcr.io/netvark/minio@sha256:14cea493... adalah image
  # yang identik byte-per-byte dengan minio/minio:latest (RepoDigest & Image ID
  # sama). Naikkan versinya lewat MINIO_IMAGE di .env.
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/netvark/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    pull_policy: missing
    restart: always
    mem_limit: 512M
    cpus: 1.0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: migrasi embedded (backend/cmd/migrate). Wajib sebelum backend
  # karena server production (APP_ENV=production) tidak auto-migrate.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 256M
    cpus: 0.5
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrate"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 512M
    cpus: 1.5
    environment:
      # Batasi heap Go di bawah cgroup mem_limit agar runtime tidak OOM-killed.
      GOMEMLIMIT: 450MiB
      GOGC: "75"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    # Dipublikasikan ke host supaya deploy.sh bisa unhealthy-check backend di
    # 127.0.0.1:8080 (siap-otsel di dalam jaringan compose saja).
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL in .env}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL:?set NEXT_PUBLIC_STORAGE_BASE_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-THC Visitor Management System}
    mem_limit: 512M
    cpus: 1.0
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  # Reverse proxy tunggal: satu origin untuk FE + BE + object storage.
  caddy:
    image: caddy:2-alpine
    restart: always
    mem_limit: 256M
    cpus: 0.5
    environment:
      # Alamat site Caddy. Default ":80" (catch-all HTTP, akses LAN via IP).
      # PENTING: default-nya harus berisi nilai, BUKAN string kosong. Placeholder
      # Caddy `{$SITE_ADDRESS::80}` hanya memakai default bila env TIDAK di-set;
      # env yang di-set string kosong membuat blok site jadi "global options" dan
      # Caddy gagal parse ("unrecognized global option: encode") lalu restart-loop.
      # Isi domain (mis. vms.thc.co.id) untuk TLS otomatis + redirect HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      # 443 hanya dilayani bila SITE_ADDRESS diisi (ACME). Tanpa domain,
      # port ini tidak ada listener — Harmless.
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat ACME & konfigurasi Caddy harus persisten; kalau tidak,
      # tiap `up --build` meminta sertifikat baru (bisa kena rate limit).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata_prod:
  miniodata_prod:
  caddy_data:
  caddy_config:
