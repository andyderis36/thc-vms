# THC-VMS production stack for VPS — self-contained (infra + app).
# Secrets: ONE file, repo-root `.env` (cp .env.prod.example .env, fill CHANGEME).
# Never commit `.env`. Start: docker compose -f docker-compose.prod.yml up -d --build
# Order is deterministic: postgres healthy -> migrate (one-shot) -> backend -> frontend -> caddy.
# Caddy adalah reverse proxy TUNGGAL (:80): /api ke backend, /s3 ke object storage,
# sisanya ke frontend. Database & object storage tidak dipublikasikan ke host.
name: thc-vms-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    # Resource cap (non-swarm, single-instance).
    mem_limit: 1G
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage S3-compatible. RustFS menggantikan MinIO karena image
  # minio/minio + minio/mc tidak bisa ditarik (tag upstream hilang), sedangkan
  # RustFS menyajikan API S3 yang kompatibel dengan minio-go (backend tidak
  # berubah sama sekali). Kredensial memakai variabel MINIO_* yang SUDAH ada
  # di .env supaya S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY backend tetap cocok.
  # Alias jaringan `minio` dipertahankan agar S3_ENDPOINT=minio:9000 pada .env
  # lama tetap resolve; S3_ENDPOINT=rustfs:9000 juga resolve.
  # Bucket TIDAK di-seed lewat container inisialisasi: backend memanggil
  # EnsureBucket saat boot (backend/internal/infrastructure/storage).
  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    mem_limit: 512M
    cpus: 1.0
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: /data
    volumes:
      - rustfsdata_prod:/data
    networks:
      default:
        aliases:
          - minio

  # One-shot: migrasi embedded (backend/cmd/migrate). Wajib sebelum backend
  # karena server production (APP_ENV=production) tidak auto-migrate.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 256M
    cpus: 0.5
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrate"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 512M
    cpus: 1.5
    environment:
      # Batasi heap Go di bawah cgroup mem_limit agar runtime tidak OOM-killed.
      GOMEMLIMIT: 450MiB
      GOGC: "75"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
    # Dipublikasikan ke host supaya deploy.sh bisa unhealthy-check backend di
    # 127.0.0.1:8080 (siap-otsel di dalam jaringan compose saja).
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL in .env}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL:?set NEXT_PUBLIC_STORAGE_BASE_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-THC Visitor Management System}
    mem_limit: 512M
    cpus: 1.0
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  # Reverse proxy tunggal: satu origin untuk FE + BE + object storage.
  caddy:
    image: caddy:2-alpine
    restart: always
    mem_limit: 256M
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata_prod:
  rustfsdata_prod:
