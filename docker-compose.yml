services:
  postgres:
    image: postgres:18-alpine
    container_name: thc-vms-postgres
    restart: always
    environment:
      POSTGRES_USER: thc_user
      POSTGRES_PASSWORD: thc_password_local
      POSTGRES_DB: thc_vms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thc_user -d thc_vms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thc-vms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_local:/data

  # One-shot: buatkan bucket privat S3_BUCKET_NAME (thc-vms-bucket) bila
  # belum ada. Bucket TETAP privat (tanpa `mc anonymous`) karena backend
  # melayani berkas lewat presigned URL ber-TTL (S3_PRESIGN_TTL_MINUTES).
  minio-init:
    image: minio/mc:latest
    container_name: thc-vms-minio-init
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb localminio/thc-vms-bucket --ignore-existing;
      exit 0;
      "

volumes:
  pgdata_local:
  miniodata_local:
