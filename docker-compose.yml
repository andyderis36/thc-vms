services:
  postgres:
    image: postgres:18-alpine
    # Jangan pernah re-pull image yang sudah ada lokal — start harus
    # offline-friendly (insiden pull Docker Hub gagal, Okt 2026).
    pull_policy: missing
    container_name: thc-vms-postgres
    restart: always
    # Resource cap (non-swarm, single-instance): batasi RAM & CPU per service.
    mem_limit: 1G
    cpus: 1.0
    environment:
      POSTGRES_USER: thc_user
      POSTGRES_PASSWORD: thc_password_local
      POSTGRES_DB: thc_vms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thc_user -d thc_vms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Pakai :latest yang sudah ada lokal & terbukti jalan. Pin RELEASE
    # dihapus karena memaksa pull tiap start (rapuh saat registry batuk).
    # Versi known-good terakhir: RELEASE.2025-09-07T16-13-09Z.
    image: minio/minio:latest
    pull_policy: missing
    container_name: thc-vms-minio
    restart: always
    mem_limit: 512M
    cpus: 1.0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_local:/data

  # minio-init DIHAPUS (Okt 2026): butuh image minio/mc yang tidak ada lokal
  # dan memaksa pull tiap start. Pembuatan bucket thc-vms-bucket sudah
  # ditangani backend EnsureBucket saat startup — bucket tetap privat.

volumes:
  pgdata_local:
  miniodata_local:
