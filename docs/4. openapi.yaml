openapi: 3.1.0
info:
  title: THC Visitor Management System (VMS) API
  version: 3.1.0
  description: |
    REST API berkinerja tinggi untuk THC Visitor Management System.
    Dibangun di atas Go Gin Clean Architecture dengan dukungan konkurensi tinggi (pgxpool)
    dan Next.js Frontend.

    ### Konvensi API MVP:
    - Base URL: `/api/v1`
    - Format Respon Standar: `{ "success": true, "data": ... }` atau `{ "success": false, "error": { "code": "...", "message": "..." } }`
    - Autentikasi: HTTP Bearer Token (JWT) pada header `Authorization: Bearer <token>`
    - Tag `[MVP]`: Endpoint prioritas wajib diimplementasikan untuk prototype siap operasional.
    - Tag `[Phase 2]`: Endpoint pelengkap untuk fase ekspansi mendatang.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.vms.thc.local/api/v1
    description: Production / Staging Server

tags:
  - name: Health
    description: Health & readiness probe untuk monitoring uptime & database pool
  - name: Auth
    description: Otentikasi praktis berbasis peran (Admin, Security, PIC)
  - name: Visits
    description: Manajemen inti siklus hidup kunjungan
  - name: SecurityGate
    description: Operasional gerbang satpam & check-in fasilitas POP (Check-in & Check-out)
  - name: MasterData
    description: Data referensi lokasi cabang, POP, miniPOP dan tujuan kunjungan
  - name: Storage
    description: Layanan upload berkas & media MinIO / S3 (Surat Tugas, Foto Identitas, Foto Check-in)
  - name: UserManagement
    description: Manajemen akun security cabang (Admin mengelola cabang sendiri, Superadmin mengelola semua cabang)
  - name: Phase2
    description: Endpoint tambahan untuk fase lanjutan (CRUD master, feedback, insiden)

security:
  - bearerAuth: []

paths:
  # ============================================================
  # HEALTH & READINESS PROBES
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service sehat dan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe (Koneksi Database pgxpool)
      security: []
      responses:
        '200':
          description: Database siap melayani request
        '503':
          description: Database belum siap / pool overload

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna (Email + Password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil dan peran pengguna yang sedang login
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan pembersihan token
      responses:
        '200':
          description: Logout berhasil

  # ============================================================
  # USER MANAGEMENT (BRANCH SECURITY)
  # ============================================================
  /users/security:
    get:
      tags: [UserManagement]
      summary: Daftar akun security (Admin melihat cabang sendiri, Superadmin melihat semua/filter cabang)
      parameters:
        - name: location_id
          in: query
          description: Filter cabang khusus Superadmin (Admin cabang otomatis terkunci ke cabangnya)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar akun security cabang berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserListResponse'
        '403':
          description: Akses ditolak (hanya untuk Admin Cabang dan Superadmin)

    post:
      tags: [UserManagement]
      summary: Registrasi akun security baru oleh Admin Cabang atau Superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityUserRequest'
      responses:
        '201':
          description: Akun security berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Admin cabang mencoba mendaftarkan security untuk cabang lain

  /users/security/{id}/status:
    patch:
      tags: [UserManagement]
      summary: Ubah status aktif/nonaktif akun security cabang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status akun security berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '403':
          description: Admin cabang tidak berwenang mengelola security di luar cabangnya
        '404':
          description: Akun security tidak ditemukan

  # ============================================================
  # MASTER DATA (READ-ONLY FOR MVP)
  # ============================================================
  /locations:
    get:
      tags: [MasterData]
      summary: Daftar fasilitas lokasi (Cabang, POP, miniPOP) THC aktif
      responses:
        '200':
          description: Daftar fasilitas lokasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'

  /purposes:
    get:
      tags: [MasterData]
      summary: Daftar opsi tujuan kunjungan (Survey, Maintenance, dll)
      responses:
        '200':
          description: Daftar opsi tujuan kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurposeListResponse'

  # ============================================================
  # OBJECT STORAGE & FILE UPLOAD (MINIO / S3)
  # ============================================================
  /uploads:
    post:
      tags: [Storage]
      summary: Unggah dokumen surat tugas (PDF/gambar) atau foto identitas ke MinIO/S3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                  description: File dokumen surat tugas (PDF/DOCX/PNG/JPG) atau foto identitas (maks 5MB)
                category:
                  type: string
                  enum: [assignment_letter, id_card, checkin_photo]
                  description: Kategori berkas untuk isolasi folder bucket MinIO
      responses:
        '201':
          description: Berkas berhasil diunggah ke MinIO/S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
        '400':
          description: Format berkas tidak didukung atau ukuran melebihi batas 5MB
        '413':
          description: Ukuran file terlalu besar

  # ============================================================
  # VISITS CORE MANAGEMENT
  # ============================================================
  /visits:
    get:
      tags: [Visits]
      summary: Daftar seluruh kunjungan (Terfilter berdasarkan peran)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Pencarian nama PIC atau Visit ID
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'

    post:
      tags: [Visits]
      summary: Buat permohonan kunjungan baru (PIC / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          description: Kunjungan berhasil diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'

  /visits/{id}:
    get:
      tags: [Visits]
      summary: Ambil rincian detail kunjungan (berdasarkan UUID atau Visit ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '404':
          description: Kunjungan tidak ditemukan

  /visits/{id}/approve:
    post:
      tags: [Visits]
      summary: Setujui permohonan kunjungan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Kunjungan disetujui (Status -> approved)

  /visits/{id}/reject:
    post:
      tags: [Visits]
      summary: Tolak permohonan kunjungan dengan alasan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Kunjungan ditolak (Status -> rejected)

  /visits/{id}/reschedule:
    post:
      tags: [Visits]
      summary: Penjadwalan ulang kunjungan (PIC / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, reason]
              properties:
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '200':
          description: Kunjungan dijadwalkan ulang (Status -> rescheduled)

  /visits/{id}/cancel:
    post:
      tags: [Visits]
      summary: Batalkan kunjungan sebelum hari-H
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Kunjungan dibatalkan (Status -> cancelled)

  /visits/{id}/qr:
    get:
      tags: [Visits]
      summary: Dapatkan data payload QR Code untuk check-in gerbang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload QR Code berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      visit_id:
                        type: string
                      qr_code_payload:
                        type: string

  # ============================================================
  # SECURITY & BRANCH CHECK-IN / CHECK-OUT
  # ============================================================
  /visits/{id}/checkin:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-in tamu oleh Security atau Admin Cabang (Live Cam, Upload QR Galeri, atau Manual)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_url:
                  type: string
                badge_code:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Check-in berhasil (Status -> visiting)
        '400':
          description: Di luar rentang toleransi waktu jadwal (±2 jam) atau QR tidak valid
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini

  /visits/{id}/checkout:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-out tamu saat selesai kunjungan (oleh Security atau Admin Cabang)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check-out berhasil (Status -> completed)
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini

  # ============================================================
  # PHASE 2 EXTENSION ENDPOINTS
  # ============================================================
  /visits/{id}/feedback:
    post:
      tags: [Phase2]
      summary: Kirim survey kepuasan pasca kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Feedback diterima

  /visits/{id}/incident:
    post:
      tags: [Phase2]
      summary: Lapor insiden darurat atau pelanggaran selama kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, severity]
              properties:
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high]
      responses:
        '201':
          description: Laporan insiden tercatat

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: healthy
            uptime:
              type: string
            timestamp:
              type: string
              format: date-time

    VisitStatus:
      type: string
      enum:
        - requested
        - approved
        - visiting
        - completed
        - not_visit
        - rejected
        - cancelled
        - rescheduled

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@thc.local
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT Access Token
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [super_admin, admin, security, pic]
          example: admin
        location_id:
          type: [string, "null"]
          format: uuid
          description: ID cabang/POP penugasan (khusus admin & security, null untuk super_admin & pic)
        location_name:
          type: [string, "null"]
          description: Nama fasilitas cabang/POP penugasan
        status:
          type: string
          enum: [active, inactive, blacklisted]
          example: active
        type:
          type: string
          enum: [internal, external]
        vendor_name:
          type: [string, "null"]

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    CreateSecurityUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: security.surabaya1@thc.local
        phone:
          type: string
          example: 081234567890
        password:
          type: string
          format: password
          example: Password123!
        location_id:
          type: string
          format: uuid
          description: Wajib untuk Superadmin. Diabaikan untuk Admin Cabang (otomatis disetel ke cabang admin).

    SecurityUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    SecurityUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Kantor Cabang Surabaya
        type:
          type: string
          enum: [pusat, cabang, pop, minipop]
          example: cabang
        address:
          type: string
        city:
          type: string
        timezone:
          type: string
          enum: [WIB, WITA, WIT]

    LocationListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    Purpose:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Maintenance

    PurposeListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Purpose'

    VisitorItem:
      type: object
      required: [name, id_number, phone]
      properties:
        name:
          type: string
        id_number:
          type: string
          description: KTP / SIM / Passport
        phone:
          type: string
        id_card_photo_url:
          type: [string, "null"]
          format: uri
          description: URL foto KTP/SIM di MinIO/S3

    CreateVisitRequest:
      type: object
      required: [location_id, purpose_ids, start_date, end_date, visitors, is_nda_accepted]
      properties:
        location_id:
          type: string
          format: uuid
        purpose_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_multi_day:
          type: boolean
          default: false
        assignment_letter_url:
          type: string
          format: uri
          description: URL berkas surat tugas / SPK vendor yang telah diunggah ke /uploads
        is_nda_accepted:
          type: boolean
          description: Persetujuan digital terhadap ketentuan keamanan THC
        notes:
          type: string
        visitors:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/VisitorItem'

    VisitDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          example: VST-9548545669
        status:
          $ref: '#/components/schemas/VisitStatus'
        location:
          $ref: '#/components/schemas/Location'
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/Purpose'
        pic_user:
          $ref: '#/components/schemas/User'
        vendor_name:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        assignment_letter_url:
          type: [string, "null"]
          format: uri
          description: URL berkas surat tugas / SPK vendor di MinIO/S3
        notes:
          type: string
        visitors:
          type: array
          items:
            $ref: '#/components/schemas/VisitorItem'
        created_at:
          type: string
          format: date-time

    VisitDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/VisitDetail'

    UploadFileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            file_url:
              type: string
              format: uri
              example: http://localhost:9000/thc-vms-bucket/assignment_letter/spk-2026-001.pdf
            file_name:
              type: string
              example: spk-2026-001.pdf
            file_size:
              type: integer
              example: 524288
            mime_type:
              type: string
              example: application/pdf

    VisitListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VisitDetail'
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer