  # ============================================================
  # OBJECT STORAGE & FILE UPLOAD (MINIO / S3)
  # ============================================================
  /uploads:
    post:
      tags: [Storage]
      summary: Unggah dokumen surat tugas (PDF/gambar) atau foto identitas ke MinIO/S3
      description: |
        Kebijakan unggah DUA LANGKAH (`x-limits.upload_ingest_max_bytes` dan
        `x-limits.upload_stored_max_bytes`):

        1. Kompresi sebelum penyimpanan: gambar diperkecil hingga sisi terpanjang
           <= 1600 px lalu di-encode ulang (JPEG kualitas 82; PNG tetap PNG).
           Khusus `profile_photo`, gambar selalu dipusatkan lalu dipotong persegi
           dan disimpan sebagai JPEG kualitas 82 dengan sisi maksimum 512 px
           (orientasi EXIF diterapkan; area transparan menjadi putih).
           PDF yang lebih besar dari 5 MB dioptimasi (struktur, xref, resource
           duplikat) dan HANYA byte hasil optimasi yang disimpan; bila optimasi
           tidak memperkecil berkas, PDF asli TIDAK disimpan.
        2. Plafon PENYIMPANAN 5 MB (5242880 byte): bila hasil akhir setelah
           kompresi masih melebihi 5 MB, permintaan ditolak dengan HTTP 413
           `FILE_TOO_LARGE` dan tidak ada berkas yang disimpan.
        3. Plafon TRANSPORT 20 MB (20971520 byte, env `MAX_UPLOAD_INGEST_MB`):
           batas berkas mentah yang boleh dikirim klien sebelum kompresi.
        4. Respons 201 memuat `file_size` = jumlah byte yang benar-benar
           disimpan (hasil kompresi), bukan ukuran berkas mentah.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas PDF/JPG/PNG. Plafon transport 20MB untuk berkas mentah; hasil akhir setelah kompresi wajib <= 5MB.
                category:
                  type: string
                  enum: [assignment_letter, id_card, checkin_photo, profile_photo, work_photos]
                  description: Kategori berkas untuk isolasi folder bucket MinIO. `profile_photo` dan `work_photos` hanya menerima `image/jpeg` dan `image/png`.
                owner_id:
                  type: string
                  deprecated: true
                  description: DEPRECATED dan DIABAIKAN oleh server. Server menurunkan segmen pemilik storage dari user terautentikasi (pending-<user_id>), sehingga nilai owner_id dari klien tidak pernah menentukan path objek. Diterima hanya agar klien lama tetap berfungsi.
      responses:
        '201':
          description: Berkas berhasil diunggah ke MinIO/S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
        '400':
          description: Format berkas tidak didukung (MIME di luar allow-list) atau berkas kosong (STORAGE_REJECTED)
        '413':
          description: Berkas melebihi plafon transport 20MB, atau hasil kompresi masih melebihi plafon penyimpanan 5MB (FILE_TOO_LARGE; tidak ada berkas tersimpan)

  # ============================================================
  # VISITS CORE MANAGEMENT
  # ============================================================
  /visits:
    get:
      tags: [Visits]
      summary: Daftar seluruh kunjungan (Terfilter berdasarkan peran)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Pencarian bebas (ILIKE, kosong = tanpa filter) atas nama vendor, nama lokasi, nama vendor, nama teknisi (visitor), nama tujuan (purpose), dan Visit ID
          schema:
            type: string
            maxLength: 100
        - name: date_from
          in: query
          description: Batas bawah window jadwal (inklusif, vr.start_date >= date_from). RFC3339 penuh (offset dipertahankan) atau date-only YYYY-MM-DD (midnight UTC). Kosong = tanpa filter.
          schema:
            type: string
            format: date-time
            example: '2026-10-01'
        - name: date_to
          in: query
          description: Batas atas window jadwal. RFC3339 diteruskan tepat (eksklusif, vr.start_date < date_to); date-only YYYY-MM-DD mencakup sehari penuh (inklusif, digeser +24 jam di backend). Range terbalik (date_from > date_to) ditolak 400 VALIDATION_ERROR. Hanya mempersempit dalam scoping peran, tak pernah melebarkan visibilitas.
          schema:
            type: string
            format: date-time
            example: '2026-10-03'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort_by
          in: query
          description: Kolom urutan (created_at, start_date, end_date). Default created_at. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [created_at, start_date, end_date]
            default: created_at
        - name: order
          in: query
          description: Arah urutan (asc, desc). Default desc. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'

    post:
      tags: [Visits]
      summary: Buat permohonan kunjungan baru (Vendor / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          description: Kunjungan berhasil diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, field wajib hilang, panjang/format melanggar x-limits). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. urutan jadwal, NDA belum diterima, purpose atau lokasi tidak dikenal, URL berbahaya). Amplop galat: { success: false, error: { code, message } }.'

  /visits/member-suggestions:
    get:
      tags: [Visits]
      summary: Saran anggota teknisi untuk dipakai ulang pada kunjungan baru
      description: >-
        Mengembalikan anggota roster dari kunjungan sebelumnya, distinct per
        pasangan `(name, phone)` (case-insensitive pada nama) dengan data
        kunjungan TERBARU (`last_visit_at`, lalu id), dibatasi 20 entri.
        `vendor` dipaksa hanya kunjungan miliknya sendiri
        (`visit_request.vendor_user_id` = akun pemanggil) dan parameter
        `?vendor=` DIIABAIKAN untuk peran itu; `admin` dibatasi ke kunjungan
        pada cabang di cakupannya; `super_admin`/`dev-superadmin` global;
        `security` ditolak 403. Parameter `vendor_user_id` TIDAK diterima
        (risiko enumerasi PII). Daftar ini SENGAJA tanpa URL foto; tautan foto
        hanya tersedia pada endpoint pilih anggota.
      parameters:
        - name: q
          in: query
          required: false
          description: Filter nama anggota (ILIKE, substring) setelah trim; maksimal 80 karakter - nilai lebih panjang ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            maxLength: 80
        - name: vendor
          in: query
          required: false
          description: Opsional (admin/super_admin) - nama tampilan vendor untuk menyempitkan hasil ke anggota kunjungan dengan nama vendor kunjungan atau perusahaan akun vendor pemilik yang sama (case-insensitive, trim). Diabaikan untuk peran vendor.
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Saran anggota berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSuggestionListResponse'
        '400':
          description: 'Parameter q melebihi 80 karakter (VALIDATION_ERROR).'
        '403':
          description: 'Hanya super_admin, dev-superadmin, admin, dan vendor (FORBIDDEN_BRANCH).'

  /visits/member-suggestions/{visitorId}:
    get:
      tags: [Visits]
      summary: Ambil satu anggota pilihan beserta tautan foto untuk autofill
      description: >-
        Memakai cakupan yang SAMA dengan daftar saran anggota, diterapkan pada
        kunjungan pemilik baris visitor. URL `id_card_photo_url` dan
        `photo_url` adalah presigned MinIO/S3 berumur pendek (null bila tidak
        ada berkas). Visitor yang tidak dikenal ATAU di luar cakupan pemanggil
        dijawab 404 tanpa membocorkan keberadaannya.
      parameters:
        - name: visitorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Anggota pilihan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSuggestionDetailResponse'
        '403':
          description: 'Hanya super_admin, dev-superadmin, admin, dan vendor (FORBIDDEN_BRANCH).'
        '404':
          description: 'Visitor tidak dikenal atau di luar cakupan (NOT_FOUND).'

  /visits/{id}:
    get:
      tags: [Visits]
      summary: Ambil rincian detail kunjungan (berdasarkan UUID atau Visit ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '404':
          description: Kunjungan tidak ditemukan
        '403':
          description: Di luar cakupan cabang (isolasi multi-branch AGENTS §6.1) — tanpa membocorkan data

    delete:
      tags: [Visits]
      summary: Hapus permanen kunjungan (Superadmin; status apa pun)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Kunjungan dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Kunjungan tidak ditemukan

  /visits/{id}/file:
    get:
      tags: [Visits]
      summary: Streaming satu slot berkas kunjungan (tahan tunnel, tanpa presigned URL)
      description: |
        Menyajikan isi satu slot berkas penyimpanan (surat tugas/SPK, foto KTP, atau selfie teknisi) sebagai aliran biner inline langsung dari backend, bukan URL presigned MinIO/S3. Endpoint ini dimiliki backend sepenuhnya (bukan proksi Next.js): URL presigned mengikat host storage pada tanda tangannya sehingga rusak saat dibuka lewat tunnel atau domain berbeda, sedangkan endpoint ini selalu lewat host API yang sama dengan aplikasi sehingga selamat melewati tunnel. Cakupan baca sama persis dengan `GET /visits/{id}`: global untuk super_admin, terkunci cabang untuk admin/security, dan milik sendiri untuk vendor (vendor lain dijawab 404 agar tidak membocorkan keberadaan data). Tidak ada migrasi maupun dependensi baru; URL presigned pada respons list/detail tidak berubah.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID kunjungan. Kode bisnis `VST-...` tidak diterima di sini (ID tidak valid → 400).
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [assignment_letter, id_card, selfie, work_before, work_after]
          description: Slot berkas yang disajikan. `assignment_letter` tinggal di baris kunjungan; `id_card`/`selfie` tinggal di baris tiap teknisi; `work_before`/`work_after` tinggal di baris bukti pengerjaan (visit_work_photo).
        - name: visitor_id
          in: query
          schema:
            type: string
            format: uuid
          description: UUID teknisi. Wajib untuk `id_card`/`selfie`; diabaikan untuk `assignment_letter`/`work_before`/`work_after`.
      responses:
        '200':
          description: "Isi berkas disajikan inline (`Content-Disposition: inline`, `Cache-Control: private, no-store`, `Pragma: no-cache`, `X-Content-Type-Options: nosniff`, `Accept-Ranges: bytes` beserta `Content-Length`)"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Potongan berkas untuk request `Range` (seek pratinjau; `Content-Range` menyertai respons)
        '400':
          description: ID/kind/visitor_id tidak valid (kode `VALIDATION_ERROR`, pesan Indonesia)
        '401':
          description: JWT tidak ada/tidak valid (kode `UNAUTHORIZED`)
        '403':
          description: Lintas cabang untuk admin/security (kode `FORBIDDEN_BRANCH`) — tanpa membocorkan data
        '404':
          description: Kunjungan tidak dikenal, slot kosong, teknisi tidak dikenal, atau milik vendor lain (kode `NOT_FOUND`, pesan "Berkas tidak tersedia." atau "Kunjungan tidak ditemukan.")
        '500':
          description: Gagal baca storage (kode `INTERNAL_ERROR`)

  /visits/{id}/work-photos:
    post:
      tags: [Visits]
      summary: Lampirkan bukti pengerjaan sebelum/sesudah (Vendor / Admin / Security cabang)
      description: |
        Menyimpan satu foto bukti pengerjaan (`before` = kondisi sebelum mulai, `after` = kondisi sesudah selesai) untuk kunjungan yang sedang berlangsung. URL berkas berasal dari `POST /uploads` kategori `work_photos` dan wajib lolos allowlist tautan yang sama dengan payload kunjungan. Penulisan memakai UPSERT pada `UNIQUE (visit_request_id, kind)`: lampiran pertama menjawab 201, lampiran ulang pada slot yang sama MENGGANTIKAN baris (menjawab 200) tanpa menambah baris. Pemeriksaan status dan penulisan terjadi dalam SATU transaksi terkunci (`SELECT ... FOR UPDATE`), sehingga check-out yang bersamaan tidak bisa meloloskan foto setelah kunjungan selesai. Cakupan: vendor pemilik kunjungan (vendor lain dijawab 404 agar tidak membocorkan keberadaan data), admin/security dalam cabang kunjungan (luar cabang 403), super_admin global.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: UUID kunjungan atau kode bisnis `VST-...` (jalur scan manual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, url]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [before, after]
                  description: Slot bukti pengerjaan yang dilampirkan.
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: URL berkas tersimpan dari `POST /uploads` (kategori `work_photos`).
      responses:
        '201':
          description: Bukti pengerjaan dilampirkan pertama kali; data adalah WorkPhoto slot tersebut
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/WorkPhoto'
        '200':
          description: Bukti pengerjaan diganti (slot sudah pernah dilampirkan); data adalah WorkPhoto terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/WorkPhoto'
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak, kind/url absen atau kosong). Amplop galat: { success: false, error: { code, message } }.'
        '401':
          description: JWT tidak ada/tidak valid (kode `UNAUTHORIZED`)
        '403':
          description: Lintas cabang untuk admin/security (kode `FORBIDDEN_BRANCH`) — tanpa membocorkan data
        '404':
          description: Kunjungan tidak ditemukan atau bukan milik vendor pemanggil (kode `NOT_FOUND`)
        '409':
          description: 'Kunjungan belum check-in (requested/approved/rescheduled) atau sudah selesai (completed/cancelled/not_visit/rejected) — bukti hanya dapat dilampirkan saat status visiting. Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (kind di luar before/after, atau URL di luar allowlist tautan berkas). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/approve:
    post:
      tags: [Visits]
      summary: Setujui permohonan kunjungan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan disetujui (Status -> approved)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, panjang catatan melanggar x-limits). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan tidak mengizinkan approve). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/reject:
    post:
      tags: [Visits]
      summary: Tolak permohonan kunjungan dengan alasan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan ditolak (Status -> rejected)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, alasan kurang dari 5 atau melebihi 1000 karakter). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan tidak mengizinkan reject). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/reschedule:
    post:
      tags: [Visits]
      summary: Penjadwalan ulang kunjungan (Vendor / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, reason]
              properties:
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan dijadwalkan ulang (Status -> rescheduled). Jadwal dapat digeser berulang kali, tetapi kunjungan harus disetujui kembali oleh admin sebelum check-in.
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, field wajib hilang, alasan melebihi 1000 karakter, tanggal tidak berformat date-time). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. start_date setelah end_date, jadwal sudah lewat). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/cancel:
    post:
      tags: [Visits]
      summary: Batalkan kunjungan sebelum hari-H
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan dibatalkan (Status -> cancelled)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, alasan melebihi 1000 karakter). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. pembatalan melewati batas hari-H). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/visitors/{visitorId}:
    patch:
      tags: [Visits]
      summary: Koreksi kontak anggota (Vendor pemilik kunjungan)
      description: |
        Mengoreksi nomor telepon satu anggota (teknisi) setelah kunjungan diajukan, hanya selama kunjungan masih sebelum persetujuan (status requested atau rescheduled). Hanya vendor yang mengajukan kunjungan (creator: role vendor dan id == visit.vendor_user_id) yang boleh memakai endpoint ini — admin, security, bahkan super_admin dijawab 404 agar keberadaan kunjungan tidak bocor. Nomor identitas (id_number) tidak dapat diubah: field id_number yang dikirim dijawab 400. Nilai telepon yang benar-benar berubah menaikkan penanda persistennya (phone_edited, monoton, tidak pernah kembali false); nilai yang sama dengan data tersimpan adalah no-op sukses tanpa tulis. Kunjungan berstatus selain requested/rescheduled (approved, visiting, rejected, cancelled, not_visit, completed) ditolak 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: UUID kunjungan atau kode bisnis `VST-...` (jalur scan manual).
        - name: visitorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID baris anggota (visitor.id pada VisitorItem) — id_number (nomor KTP) tidak diterima.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              minProperties: 1
              additionalProperties: false
              properties:
                phone:
                  type: string
                  pattern: "^(?:62|0)[0-9]{9,15}$"
                  maxLength: 16
                  description: 'Nomor telepon baru (disimpan kanonik: hanya digit, awalan 62 diganti 0).'
      responses:
        '200':
          description: Kontak anggota dikoreksi (atau tidak berubah — no-op sukses); data adalah VisitorItem termasuk phone_edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/VisitorItem'
        '400':
          description: 'Validasi gagal (body kosong/rusak, phone absen atau melanggar pola, id_number dikirim, atau status kunjungan bukan requested/rescheduled). Amplop galat: { success: false, error: { code, message } }.'
        '404':
          description: 'Kunjungan tidak ditemukan, bukan milik pemanggil, atau anggota tidak dikenal (semua dijawab 404 tanpa membocorkan keberadaan data). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/qr:
    get:
      tags: [Visits]
      summary: Dapatkan data payload QR Code untuk check-in gerbang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload QR Code berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      visit_id:
                        type: string
                      qr_code_payload:
                        type: string

  # ============================================================
  # SECURITY & BRANCH CHECK-IN / CHECK-OUT
  # ============================================================
  /visits/{id}/checkin:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-in tamu oleh Security, Admin Cabang, atau Superadmin (bypass lintas cabang saat darurat; Live Cam, Upload QR Galeri, atau Manual)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_url:
                  type: string
                badge_code:
                  type: string
                  maxLength: 64
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Check-in berhasil (Status approved -> visiting; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '400':
          description: Di luar rentang toleransi waktu jadwal (±2 jam) atau QR tidak valid
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan bukan approved). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/checkout:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-out tamu saat selesai kunjungan (oleh Security, Admin Cabang, atau Superadmin bypass lintas cabang saat darurat)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check-out berhasil (Status -> completed; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '400':
          description: 'Validasi lapisan HTTP gagal (ID kunjungan tidak valid). Amplop galat: { success: false, error: { code, message } }.'
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan bukan visiting). Amplop galat: { success: false, error: { code, message } }.'

  # ============================================================
  # PHASE 2 EXTENSION ENDPOINTS
  # ============================================================
  /visits/{id}/feedback:
    post:
      tags: [Phase2]
      summary: Kirim survey kepuasan pasca kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Feedback diterima

  /visits/{id}/incident:
    post:
      tags: [Phase2]
      summary: Lapor insiden darurat atau pelanggaran selama kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, severity]
              properties:
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high]
      responses:
        '201':
          description: Laporan insiden tercatat

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: healthy
            uptime:
              type: string
            timestamp:
              type: string
              format: date-time

    VisitStatus:
      type: string
      enum:
        - requested
        - approved
        - visiting
        - completed
        - not_visit
        - rejected
        - cancelled
        - rescheduled

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@transhybrid.net.id
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT Access Token
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: "^(?:62|0)[0-9]{9,15}$"
          maxLength: 16
        nik:
          type: [string, "null"]
          pattern: ^\d{16}$
          description: NIK KTP tepat 16 digit angka; wajib untuk admin & vendor, null untuk security & super_admin (BE menolak NIK untuk keduanya)
        role:
          type: string
          enum: [super_admin, admin, security, vendor]
          example: admin
        location_id:
          type: [string, "null"]
          format: uuid
          description: ID cabang/POP penugasan (khusus admin & security, null untuk super_admin & vendor)
        location_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Daftar cabang/POP penugasan (1-to-many branch scoping, model hibrida, accept-either/return-both dengan location_id); location_id tetap primer selamanya sebagai display-default/elemen pertama
        location_name:
          type: [string, "null"]
          description: Nama fasilitas cabang/POP penugasan
        status:
          type: string
          enum: [active, inactive, pending, blacklisted]
          example: active
        type:
          type: string
          enum: [internal, external]
        vendor_name:
          type: [string, "null"]
          maxLength: 120
          description: Nama perusahaan vendor akun ini (override ketikan manual bila ada, kalau tidak nama katalog vendor; TIDAK terdaftar di katalog bila diketik manual dan TIDAK pernah tampil di dropdown vendor)
        avatar_url:
          type: [string, "null"]
          maxLength: 2048
          description: Path API host-agnostic `/api/v1/avatars/{id}?v=...` yang isinya dialirkan oleh `GET /avatars/{id}` (bukan URL storage); `v` adalah versi cache yang berubah saat foto diunggah ulang. Null bila belum ada foto profil. URL bucket mentah tidak pernah diekspos.
        editable_fields:
          type: array
          items:
            type: string
            enum: [name, phone, avatar_url]
          description: Daftar field yang boleh diubah sendiri oleh pemanggil, dihitung dari peran pemanggil; hanya dijamin ada pada respons `/auth/me`.

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    CreateSecurityUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          format: email
          maxLength: 254
          example: security.surabaya1@transhybrid.net.id
        phone:
          type: string
          pattern: "^(?:62|0)[0-9]{9,15}$"
          maxLength: 16
          example: 081234567890
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Password123!
        location_id:
          type: string
          format: uuid
          description: Wajib untuk Superadmin. Diabaikan untuk Admin Cabang (otomatis disetel ke cabang admin).

    SecurityUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    SecurityUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive, pending]



    UpdateSecurityUserRequest:
      type: object
      description: Parsial — member absen berarti biarkan kolom; password non-kosong me-reset hash baru
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          pattern: "^(?:62|0)[0-9]{9,15}$"
          maxLength: 16
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Kosong/absen = biarkan; terisi = reset hash baru
        location_id:
          type: [string, "null"]
          format: uuid
          description: Cabang penugasan baru untuk akun security (mutasi lokasi). Absen/null = biarkan cabang saat ini (PATCH yang hanya berisi member ini tetap dianggap tanpa perubahan dan dijawab 400). Hanya Superadmin yang boleh mengisinya; Admin Cabang yang mengirim member ini mendapat 403.

    UpdateSelfProfileRequest:
      type: object
      additionalProperties: false
      description: |
        Profil mandiri pengguna yang sedang login. `phone` dan `avatar_url`
        diterima untuk semua peran; `name` HANYA diterima untuk peran
        `super_admin` (peran lain dijawab 403 FORBIDDEN). `new_password` bersama
        `current_password` memutar kata sandi sendiri untuk semua peran
        (termasuk `super_admin` dan `dev-superadmin` lewat jalur yang sama).
        Kunci `password` lama, email, nik, role, user type, status, dan location
        TIDAK diterima.
      properties:
        name:
          type: string
          maxLength: 100
          description: Hanya diterima untuk peran `super_admin`; peran lain dijawab 403 FORBIDDEN. Perubahan dicatat sebagai `user.update` dengan metadata nama lama dan nama baru.
        phone:
          type: string
          pattern: "^(?:62|0)[0-9]{9,15}$"
          maxLength: 16
          description: Nomor telepon kanonik (hanya digit, awalan 62 diganti 0).
        avatar_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: URL yang dikembalikan oleh `POST /uploads` dengan kategori `profile_photo`; null menghapus avatar.
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Kata sandi baru pengganti milik sendiri (semua peran). Wajib disertai `current_password`; tanpa bukti itu dijawab 400, bukti salah dijawab 401. Tidak pernah dikembalikan pada respons.
        current_password:
          type: string
          format: password
          description: Bukti kata sandi saat ini untuk rotasi milik sendiri (wajib bila `new_password` dikirim); salah dijawab 401 dengan pesan "Password saat ini salah.". Tidak pernah disimpan atau dikembalikan.

    EmailChangeRequest:
      type: object
      required: [new_email, current_password]
      additionalProperties: false
      description: |
        Permintaan tautan verifikasi ganti email mandiri. `new_email` adalah
        alamat tujuan yang akan diverifikasi; `current_password` adalah bukti
        kata sandi saat ini sebagai anti-pengambilalihan. Kunci lain (termasuk
        `email`) TIDAK diterima — ganti email lewat `PATCH /auth/me` ditolak.
      properties:
        new_email:
          type: string
          format: email
          maxLength: 254
          description: Alamat email baru tujuan verifikasi.
        current_password:
          type: string
          format: password
          description: Bukti kata sandi saat ini; salah dijawab 401 dengan pesan "Password saat ini salah.". Tidak pernah disimpan atau dikembalikan.

    EmailChangeRequestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message:
              type: string
              example: Tautan verifikasi telah dikirim ke email baru Anda.

    EmailChangeConfirmRequest:
      type: object
      required: [token]
      additionalProperties: false
      description: |
        Konfirmasi ganti email dengan token verifikasi dari tautan yang dikirim
        ke alamat email baru. Token tidak valid atau kedaluwarsa dijawab 400
        INVALID_TOKEN dengan pesan generik "Tautan tidak valid atau kedaluwarsa.".
      properties:
        token:
          type: string
          description: Token verifikasi dari tautan email baru (opaque, sekali pakai).

