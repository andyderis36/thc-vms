openapi: 3.1.0
info:
  title: THC Visitor Management System (VMS) API
  version: 3.1.0
  description: |
    REST API berkinerja tinggi untuk THC Visitor Management System.
    Dibangun di atas Go Gin Clean Architecture dengan dukungan konkurensi tinggi (pgxpool)
    dan Next.js Frontend.

    ### Konvensi API MVP:
    - Base URL: `/api/v1`
    - Format Respon Standar: `{ "success": true, "data": ... }` atau `{ "success": false, "error": { "code": "...", "message": "..." } }`
    - Autentikasi: HTTP Bearer Token (JWT) pada header `Authorization: Bearer <token>`
    - Tag `[MVP]`: Endpoint prioritas wajib diimplementasikan untuk prototype siap operasional.
    - Tag `[Phase 2]`: Endpoint pelengkap untuk fase ekspansi mendatang.

# Batas input kanonik (SSOT). Nilai di sini WAJIB sama dengan
# backend/internal/validation/limits.go dan frontend/src/lib/limits.ts.
# Nomor telepon disimpan kanonik: hanya digit, awalan 62 diganti 0
# ("+62 812-3456-7890" -> "081234567890") sebelum pattern di bawah dicek.
# Dua plafon unggah bersifat sengaja: upload_ingest_max_bytes adalah plafon
# TRANSPORT (berkas mentah sebelum kompresi, env MAX_UPLOAD_INGEST_MB), sedangkan
# upload_stored_max_bytes adalah plafon PENYIMPANAN (hasil akhir setelah kompresi).
x-limits:
  name_max_length: 100
  id_number_pattern: "^[A-Za-z0-9]{8,20}$"
  id_number_max_length: 20
  phone_pattern: "^(?:62|0)[0-9]{9,15}$"
  phone_min_length: 10
  phone_max_length: 16
  password_min_length: 8
  password_max_bytes: 72
  email_max_length: 254
  text_max_length: 1000
  reject_reason_min_length: 5
  facility_name_max_length: 100
  facility_address_max_length: 255
  facility_city_max_length: 100
  purpose_name_max_length: 100
  visit_id_input_max_length: 64
  badge_code_max_length: 64
  checkin_notes_max_length: 500
  search_query_max_length: 100
  suggestion_query_max_length: 80
  vendor_name_max_length: 120
  jabatan_max_length: 120
  purpose_note_max_length: 200
  nik_length: 16
  technicians_max: 10
  json_body_max_bytes: 1048576
  upload_stored_max_bytes: 5242880
  upload_ingest_max_bytes: 20971520

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.vms.thc.local/api/v1
    description: Production / Staging Server

tags:
  - name: Health
    description: Health & readiness probe untuk monitoring uptime & database pool
  - name: Auth
    description: Otentikasi praktis berbasis peran (Admin, Security, Vendor)
  - name: Visits
    description: Manajemen inti siklus hidup kunjungan
  - name: SecurityGate
    description: Operasional gerbang pengawas & check-in fasilitas POP (Check-in & Check-out)
  - name: MasterData
    description: Data referensi lokasi cabang, POP, miniPOP dan tujuan kunjungan
  - name: Storage
    description: Layanan upload berkas & media MinIO / S3 (Surat Tugas, Foto Identitas, Foto Check-in)
  - name: UserManagement
    description: Manajemen akun security cabang (Admin mengelola cabang sendiri, Superadmin mengelola semua cabang)
  - name: Phase2
    description: Endpoint tambahan untuk fase lanjutan (CRUD master, feedback, insiden)

security:
  - bearerAuth: []

paths:
  # ============================================================
  # HEALTH & READINESS PROBES
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service sehat dan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe (Koneksi Database pgxpool)
      security: []
      responses:
        '200':
          description: Database siap melayani request
        '503':
          description: Database belum siap / pool overload

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna (Email + Password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid
        '403':
          description: 'Akun belum aktif — pendaftaran vendor menunggu persetujuan superadmin: status pending → 403 ACCOUNT_PENDING "Akun Anda menunggu persetujuan superadmin.", status inactive → 403 ACCOUNT_INACTIVE "Akun Anda dinonaktifkan.". Amplop galat: { success: false, error: { code, message } }.'

  /auth/register:
    post:
      tags: [Auth]
      summary: Pendaftaran akun Vendor/Mitra mandiri (publik, tanpa auth)
      description: |
        Formulir publik dari halaman masuk ("Daftar sebagai Vendor/Mitra").
        Tanpa autentikasi, dibatasi rate limiter yang sama dengan login.
        Akun BARU SELALU berstatus `pending` dan tidak dapat masuk sampai
        superadmin mengaktifkannya (`PATCH /users/{id}/status`). Aktivasi dan
        penolakan (hapus) hanya boleh dilakukan superadmin/dev-superadmin lewat
        endpoint manajemen yang sudah ada; peran `role` dan `location_id`
        tidak diterima dari body (diturunkan server: vendor, tanpa cabang).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVendorRequest'
      responses:
        '201':
          description: Pendaftaran diterima — akun menunggu persetujuan (status pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterVendorResponse'
        '400':
          description: Format data tidak valid (nama/email/password/NIK/telepon/vendor)
        '409':
          description: Email sudah terdaftar
        '429':
          description: 'Terlalu banyak percobaan (rate limiter login). Amplop galat: { success: false, error: { code: "RATE_LIMITED", message } }.'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil dan peran pengguna yang sedang login
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    patch:
      tags: [Auth]
      operationId: updateSelfProfile
      summary: Perbarui profil sendiri (telepon & foto untuk semua peran; nama khusus Superadmin; ganti kata sandi sendiri)
      description: |
        Memperbarui profil pengguna yang sedang login. Semua peran boleh mengubah
        `phone` dan `avatar_url`. Hanya `super_admin` yang boleh mengubah `name`
        miliknya sendiri; peran lain yang mengirim `name` ditolak 403 `FORBIDDEN`.
        Semua peran (termasuk `super_admin` dan `dev-superadmin`) boleh mengganti
        kata sandinya sendiri dengan mengirim `new_password` bersama
        `current_password` sebagai bukti anti-pengambilalihan: `current_password`
        salah dijawab 401 `INVALID_CREDENTIALS`, `new_password` yang melanggar
        kebijakan kata sandi (minimal 8 karakter) dijawab 400 `VALIDATION_ERROR`.
        Kunci `password` lama tidak diterima (400). Email, nik, role, user type,
        status, dan location tidak diterima. Perubahan nama dicatat sebagai
        `user.update` pada audit_log dengan metadata nama lama dan nama baru
        (audit_log tidak memiliki snapshot nama); rotasi kata sandi dicatat
        dengan metadata `fields` berisi `password` tanpa nilai rahasia apa pun.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfProfileRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'Body kosong, field tidak dikenal, `current_password` absen saat `new_password` dikirim, atau panjang/format melanggar x-limits (VALIDATION_ERROR). Amplop galat: { success: false, error: { code, message } }.'
        '401':
          description: 'Tanpa token atau token kedaluwarsa (UNAUTHORIZED), atau `current_password` salah saat ganti kata sandi (INVALID_CREDENTIALS, pesan "Password saat ini salah."). Amplop galat: { success: false, error: { code, message } }.'
        '403':
          description: 'Peran selain super_admin mengirim `name` (FORBIDDEN). Amplop galat: { success: false, error: { code, message } }.'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan pembersihan token
      responses:
        '200':
          description: Logout berhasil

  /auth/email-change/request:
    post:
      tags: [Auth]
      summary: Minta tautan verifikasi ganti email mandiri (publik, dibatasi rate limiter)
      description: |
        Meminta tautan verifikasi ke alamat email baru. Wajib menyertakan
        `current_password` sebagai bukti anti-pengambilalihan. Respons selalu
        generik 202 agar tidak membocorkan apakah email sudah terdaftar:
        `{ success: true, data: { message: "..." } }`. Tautan verifikasi
        dikirim ke alamat email baru; base URL tautan di-resolve pada tugas
        berikutnya (T5). Ganti email langsung lewat `PATCH /auth/me` tetap
        ditolak 400 (kunci `email` tidak diterima).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Permintaan diterima — tautan verifikasi dikirim ke email baru bila data valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeRequestResponse'
        '400':
          description: 'Format data tidak valid (VALIDATION_ERROR). Amplop galat: { success: false, error: { code, message } }.'
        '401':
          description: 'Kata sandi saat ini salah (INVALID_CREDENTIALS, pesan "Password saat ini salah."). Amplop galat: { success: false, error: { code, message } }.'
        '429':
          description: 'Terlalu banyak percobaan (rate limiter login). Amplop galat: { success: false, error: { code: "RATE_LIMITED", message } }.'

  /auth/email-change/confirm:
    post:
      tags: [Auth]
      summary: Konfirmasi ganti email dengan token verifikasi
      description: |
        Menukar token verifikasi dari tautan yang dikirim ke alamat email baru
        menjadi alamat email yang diperbarui. Token tidak valid atau kedaluwarsa
        dijawab 400 `INVALID_TOKEN` dengan pesan generik
        "Tautan tidak valid atau kedaluwarsa.".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
      responses:
        '200':
          description: Email berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'Token tidak valid atau kedaluwarsa (INVALID_TOKEN, pesan "Tautan tidak valid atau kedaluwarsa."). Amplop galat: { success: false, error: { code, message } }.'
        '401':
          description: 'Tanpa token atau token kedaluwarsa (UNAUTHORIZED). Amplop galat: { success: false, error: { code, message } }.'
        '429':
          description: 'Terlalu banyak percobaan (rate limiter login). Amplop galat: { success: false, error: { code: "RATE_LIMITED", message } }.'

  # ============================================================
  # USER MANAGEMENT (BRANCH SECURITY)
  # ============================================================
  /users/security:
    get:
      tags: [UserManagement]
      summary: Daftar akun security (Admin melihat cabang sendiri, Superadmin melihat semua/filter cabang)
      parameters:
        - name: location_id
          in: query
          description: Filter cabang khusus Superadmin (Admin cabang otomatis terkunci ke cabangnya)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar akun security cabang berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserListResponse'
        '403':
          description: Akses ditolak (hanya untuk Admin Cabang dan Superadmin)

    post:
      tags: [UserManagement]
      summary: Registrasi akun security baru oleh Admin Cabang atau Superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityUserRequest'
      responses:
        '201':
          description: Akun security berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Admin cabang mencoba mendaftarkan security untuk cabang lain
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. email sudah dipakai atau location_id tidak sah). Amplop galat: { success: false, error: { code, message } }.'

  /users/security/{id}/status:
    patch:
      tags: [UserManagement]
      summary: Ubah status aktif/nonaktif akun security cabang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status akun security berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '403':
          description: Admin cabang tidak berwenang mengelola security di luar cabangnya
        '404':
          description: Akun security tidak ditemukan

  /users/security/{id}:
    patch:
      tags: [UserManagement]
      summary: Ubah data akun security cabang — parsial + reset password (Superadmin semua cabang; Admin terkunci ke cabangnya)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityUserRequest'
      responses:
        '200':
          description: Data akun security berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (vendor/security dilarang; Admin lintas cabang dilarang)
        '404':
          description: Akun security tidak ditemukan (termasuk non-security)
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. lokasi tujuan di luar wewenang). Amplop galat: { success: false, error: { code, message } }.'
        '409':
          description: Email sudah dipakai akun lain
    delete:
      tags: [UserManagement]
      summary: Hapus permanen akun security cabang (Superadmin semua cabang; Admin terkunci ke cabangnya)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Akun security dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (vendor/security dilarang; Admin lintas cabang dilarang)
        '404':
          description: Akun security tidak ditemukan (termasuk non-security)
        '409':
          description: Petugas masih memiliki kunjungan terkait

  # ============================================================
  # MASTER DATA (READ-ONLY FOR MVP)
  # ============================================================
  /locations:
    get:
      tags: [MasterData]
      summary: Daftar fasilitas lokasi (Cabang, POP, miniPOP) THC
      parameters:
        - name: active_only
          in: query
          description: true (default) hanya fasilitas aktif; false menyertakan nonaktif (halaman admin)
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Daftar fasilitas lokasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'

    post:
      tags: [MasterData]
      summary: Tambah fasilitas lokasi baru (Superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Fasilitas lokasi berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '409':
          description: Kantor Pusat sudah terdaftar. Hanya boleh ada satu Kantor Pusat.
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. kombinasi tipe/timezone tidak sah). Amplop galat: { success: false, error: { code, message } }.'

  /locations/{id}:
    patch:
      tags: [MasterData]
      summary: Ubah parsial fasilitas lokasi / toggle aktif-nonaktif (Superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Fasilitas lokasi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Fasilitas lokasi tidak ditemukan
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. menonaktifkan lokasi yang masih dipakai). Amplop galat: { success: false, error: { code, message } }.'
        '409':
          description: Kantor Pusat sudah terdaftar. Hanya boleh ada satu Kantor Pusat.

    delete:
      tags: [MasterData]
      summary: Hapus permanen fasilitas lokasi (Superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fasilitas lokasi dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Fasilitas lokasi tidak ditemukan
        '409':
          description: Fasilitas masih digunakan oleh kunjungan atau pengguna

  /users:
    get:
      tags: [UserManagement]
      summary: Daftar pengguna lintas cabang dengan filter peran/pencarian/cabang (Superadmin)
      parameters:
        - name: role
          in: query
          description: Filter peran (admin, vendor, security)
          schema:
            type: string
        - name: search
          in: query
          description: Pencarian nama atau email
          schema:
            type: string
            maxLength: 100
        - name: location_id
          in: query
          description: Filter cabang penugasan
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Akses ditolak (hanya untuk Superadmin)

    post:
      tags: [UserManagement]
      summary: Daftarkan akun admin cabang atau vendor baru (Superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUserRequest'
      responses:
        '201':
          description: Akun pengguna berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '409':
          description: Email sudah terdaftar
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. pasangan peran/lokasi tidak sah). Amplop galat: { success: false, error: { code, message } }.'

  /users/{id}:
    patch:
      tags: [UserManagement]
      summary: Ubah data akun pengguna — parsial, tanpa role/status (Superadmin; password = reset hash)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedUserRequest'
      responses:
        '200':
          description: Data akun pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid atau pasangan peran/lokasi dilanggar
        '401':
          description: Bukti password saat ini salah (khusus reset password akun sendiri)
        '403':
          description: Akses ditolak (hanya Superadmin; reset password super_admin lain dilarang)
        '404':
          description: Akun pengguna tidak ditemukan
        '409':
          description: Email sudah dipakai akun lain
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. target peran tidak konsisten dengan lokasi). Amplop galat: { success: false, error: { code, message } }.'
    delete:
      tags: [UserManagement]
      summary: 'Hapus permanen akun pengguna (Superadmin; larangan: akun sendiri & super_admin)'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Akun pengguna dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya Superadmin; akun sendiri & super_admin dilarang)
        '404':
          description: Akun pengguna tidak ditemukan
        '409':
          description: Pengguna masih memiliki kunjungan terkait

  /users/{id}/status:
    patch:
      tags: [UserManagement]
      summary: 'Ubah status aktif/nonaktif akun pengguna, termasuk persetujuan pending→aktif (Superadmin; larangan: akun sendiri & super_admin)'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status akun pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya Superadmin; akun sendiri & super_admin dilarang)
        '404':
          description: Akun pengguna tidak ditemukan

  /avatars/{id}:
    get:
      tags: [UserManagement]
      summary: Streaming foto profil akun (tahan tunnel, tanpa presigned URL)
      security:
        - bearerAuth: []
      description: |
        Menyajikan isi foto profil satu akun sebagai aliran biner inline langsung dari backend, bukan URL presigned MinIO/S3. URL presigned mengikat host storage internal pada tanda tangannya sehingga rusak saat dibuka lewat tunnel atau domain berbeda; `avatar_url` pada respons API karena itu berupa path API ini (`/api/v1/avatars/{id}?v=...`), dan endpoint ini selalu lewat host API yang sama dengan aplikasi. Cakupan baca fail-closed: akun sendiri, super_admin global, atau akun satu cabang (admin/security); kombinasi lain dijawab 404 tanpa membocorkan keberadaan akun. Vendor tidak punya location_id sehingga hanya pernah melihat dirinya sendiri.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID akun pemilik foto profil.
      responses:
        '200':
          description: "Isi foto profil disajikan inline (`Content-Disposition: inline`, `Cache-Control: private, max-age=300`, `ETag`, `X-Content-Type-Options: nosniff`)"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: Tidak berubah - `If-None-Match` cocok dengan `ETag` yang disajikan
        '400':
          description: 'ID pengguna bukan UUID (kode `VALIDATION_ERROR`, pesan Indonesia). Amplop galat: { success: false, error: { code, message } }.'
        '401':
          description: 'JWT tidak ada/tidak valid (kode `UNAUTHORIZED`). Amplop galat: { success: false, error: { code, message } }.'
        '404':
          description: 'Akun tidak dikenal, bukan dalam cakupan pemanggil, avatar kosong, atau berkas tidak dapat dibaca (kode `NOT_FOUND`, pesan "Foto profil tidak tersedia."). Amplop galat: { success: false, error: { code, message } }.'

