        location_id:
          type: [string, "null"]
          format: uuid
          description: Absen/null = biarkan; mengikuti aturan peran target (admin wajib cabang, vendor tanpa cabang)
        location_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Opsional — absen = biarkan (accept-either dengan location_id); location_id tetap primer selamanya sebagai display-default/elemen pertama
        vendor_id:
          type: [string, "null"]
          description: Absen/null = biarkan; hanya untuk role vendor
        vendor_name:
          type: [string, "null"]
          maxLength: 120
          description: Absen = biarkan; string kosong = bersihkan jadi null; terisi = set override (maks 120 karakter setelah trim); hanya untuk role vendor; bila vendor_id dikirim maka vendor_id menang (katalog); TIDAK terdaftar di katalog vendor

