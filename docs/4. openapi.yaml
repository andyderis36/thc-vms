          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/VisitorItem'

    VisitDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          example: VST-9548545669
        status:
          $ref: '#/components/schemas/VisitStatus'
        location:
          $ref: '#/components/schemas/Location'
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/Purpose'
        pic_user:
          $ref: '#/components/schemas/User'
          deprecated: true
          description: Alias lama (legacy) untuk `vendor_user`. Dipertahankan sementara pada fase transisi ini, digantikan oleh `vendor_user`, dan akan dihapus pada fase berikutnya.
        vendor_user:
          $ref: '#/components/schemas/User'
          description: User vendor (mitra) yang mengajukan kunjungan ini.
        vendor_name:
          type: string
          description: Nama vendor/mitra tampilan kunjungan — override manual per kunjungan (vendor_name request) bila terisi, kalau tidak nama katalog vendor kunjungan, kalau tidak perusahaan akun vendor pengaju
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        assignment_letter_url:
          type: [string, "null"]
          format: uri
          description: URL bertanda tangan (presigned) berumur pendek untuk berkas surat tugas / SPK vendor di bucket privat MinIO/S3, bukan URL stabil — muat ulang detail kunjungan untuk tautan baru; null bila tidak ada berkas milik bucket
        notes:
          type: string
          maxLength: 1000
        purpose_note:
          type: [string, "null"]
          maxLength: 200
          description: Tujuan kunjungan tambahan yang diketik bebas / "tujuan lain" (maks 200 karakter); null bila tidak ada; TIDAK terdaftar di katalog purpose
        status_note:
          type: [string, "null"]
          description: Catatan pada transisi status saat ini (alasan penolakan, pembatalan, atau perubahan jadwal); null bila tidak ada
        visitors:
          type: array
          items:
            $ref: '#/components/schemas/VisitorItem'
        created_at:
          type: string
          format: date-time
        check_in_at:
          type: [string, "null"]
          format: date-time
          description: Waktu check-in aktual di gerbang (tabel check_in.checked_in_at); null bila belum check-in
        check_out_at:
          type: [string, "null"]
          format: date-time
          description: Waktu check-out aktual di gerbang (tabel check_out.checked_out_at); null bila belum check-out
        checked_in_by:
          type: [string, "null"]
          format: uuid
          description: ID petugas (security/admin) pelaksana check-in (tabel check_in.checked_in_by); null bila belum check-in
        created_by_name:
          type: [string, "null"]
          description: Nama tampilan pengaju kunjungan dari join users (visit_request.created_by); diisi HANYA oleh GET /visits/{id} bila akun pengaju dikenal, absen bila tidak
        created_by_role_label:
          type: [string, "null"]
          description: Label peran Bahasa Indonesia pengaju (Superadmin / Admin Cabang / Petugas Keamanan / Vendor/Mitra) dari join role; diisi HANYA bersama created_by_name
        checked_in_by_name:
          type: [string, "null"]
          description: Nama tampilan petugas pelaksana check-in dari join users (tabel check_in.checked_in_by); diisi HANYA oleh GET /visits/{id} setelah check-in, absen bila belum
        checked_out_by_name:
          type: [string, "null"]
          description: Nama tampilan petugas pelaksana check-out dari join users (tabel check_out.checked_out_by); diisi HANYA oleh GET /visits/{id} setelah check-out, absen bila belum
        history:
          type: array
          description: Jejak perubahan status dengan pelaku yang sudah dinamai, urut tertua -> terbaru (maksimal 50 baris terbaru); diisi HANYA oleh GET /visits/{id}, absen pada item daftar
          items:
            $ref: '#/components/schemas/VisitHistoryEntry'
        work_photos:
          type: object
          description: Bukti pengerjaan sebelum/sesudah (tabel visit_work_photo); diisi HANYA oleh GET /visits/{id}, tiap slot null hingga dilampirkan via POST /visits/{id}/work-photos
          properties:
            before:
              $ref: '#/components/schemas/WorkPhoto'
              nullable: true
            after:
              $ref: '#/components/schemas/WorkPhoto'
              nullable: true

    VisitHistoryEntry:
      type: object
      description: Satu baris status_history pada riwayat kunjungan. actor_name dan actor_role_label null untuk transisi sistem (status_history.changed_by IS NULL, mis. aturan otomatis worker).
      properties:
        status:
          $ref: '#/components/schemas/VisitStatus'
        at:
          type: string
          format: date-time
          description: Waktu transisi (status_history.changed_at) dalam RFC3339
        actor_name:
          type: [string, "null"]
          description: Nama tampilan pelaku transisi dari join users; null bila transisi sistem
        actor_role_label:
          type: [string, "null"]
          description: Label peran Bahasa Indonesia pelaku dari join role (Superadmin / Admin Cabang / Petugas Keamanan / Vendor/Mitra); null bila transisi sistem atau peran tak dikenal

    WorkPhoto:
      type: object
      description: Satu slot bukti pengerjaan kunjungan (visit_work_photo.kind). `url` pada respons lampir adalah URL tersimpan; pada detail kunjungan adalah URL presigned berumur pendek (null bila tautan tidak tersedia). `uploaded_by` null bila akun pengunggah sudah dihapus.
      properties:
        kind:
          type: string
          enum: [before, after]
          description: Slot bukti pengerjaan; hanya pada respons POST /visits/{id}/work-photos (slot detail sudah menamainya dari posisi)
        url:
          type: [string, "null"]
          format: uri
        uploaded_by:
          type: [string, "null"]
          format: uuid
          description: ID akun pengunggah bukti; null bila akun sudah dihapus
        uploaded_by_name:
          type: [string, "null"]
          description: Nama tampilan pengunggah bukti dari join users; null bila tidak dikenal
        uploaded_at:
          type: string
          format: date-time
          description: Waktu lampiran tersimpan (diperbarui setiap penggantian)

    VisitDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/VisitDetail'

    UploadFileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            file_url:
              type: string
              format: uri
              example: http://localhost:9000/thc-vms-bucket/assignment_letter/spk-2026-001.pdf
            file_name:
              type: string
              example: spk-2026-001.pdf
            file_size:
              type: integer
              example: 524288
            mime_type:
              type: string
              example: application/pdf

    VisitListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VisitDetail'
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer