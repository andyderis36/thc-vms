      description: |
        Profil mandiri pengguna yang sedang login. `phone` dan `avatar_url`
        diterima untuk semua peran; `name` HANYA diterima untuk peran
        `super_admin` (peran lain dijawab 403 FORBIDDEN). `new_password` bersama
        `current_password` memutar kata sandi sendiri untuk semua peran
        (termasuk `super_admin` dan `dev-superadmin` lewat jalur yang sama).
        Kunci `password` lama, email, nik, role, user type, status, dan location
        TIDAK diterima.
      properties:
