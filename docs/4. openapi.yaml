openapi: 3.1.0
info:
  title: THC Visitor Management System (VMS) API
  version: 3.1.0
  description: |
    REST API berkinerja tinggi untuk THC Visitor Management System.
    Dibangun di atas Go Gin Clean Architecture dengan dukungan konkurensi tinggi (pgxpool)
    dan Next.js Frontend.

    ### Konvensi API MVP:
    - Base URL: `/api/v1`
    - Format Respon Standar: `{ "success": true, "data": ... }` atau `{ "success": false, "error": { "code": "...", "message": "..." } }`
    - Autentikasi: HTTP Bearer Token (JWT) pada header `Authorization: Bearer <token>`
    - Tag `[MVP]`: Endpoint prioritas wajib diimplementasikan untuk prototype siap operasional.
    - Tag `[Phase 2]`: Endpoint pelengkap untuk fase ekspansi mendatang.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.vms.thc.local/api/v1
    description: Production / Staging Server

tags:
  - name: Health
    description: Health & readiness probe untuk monitoring uptime & database pool
  - name: Auth
    description: Otentikasi praktis berbasis peran (Admin, Security, Vendor)
  - name: Visits
    description: Manajemen inti siklus hidup kunjungan
  - name: SecurityGate
    description: Operasional gerbang pengawas & check-in fasilitas POP (Check-in & Check-out)
  - name: MasterData
    description: Data referensi lokasi cabang, POP, miniPOP dan tujuan kunjungan
  - name: Storage
    description: Layanan upload berkas & media MinIO / S3 (Surat Tugas, Foto Identitas, Foto Check-in)
  - name: UserManagement
    description: Manajemen akun security cabang (Admin mengelola cabang sendiri, Superadmin mengelola semua cabang)
  - name: Phase2
    description: Endpoint tambahan untuk fase lanjutan (CRUD master, feedback, insiden)

security:
  - bearerAuth: []

paths:
  # ============================================================
  # HEALTH & READINESS PROBES
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service sehat dan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe (Koneksi Database pgxpool)
      security: []
      responses:
        '200':
          description: Database siap melayani request
        '503':
          description: Database belum siap / pool overload

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna (Email + Password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil dan peran pengguna yang sedang login
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan pembersihan token
      responses:
        '200':
          description: Logout berhasil

  # ============================================================
  # USER MANAGEMENT (BRANCH SECURITY)
  # ============================================================
  /users/security:
    get:
      tags: [UserManagement]
      summary: Daftar akun security (Admin melihat cabang sendiri, Superadmin melihat semua/filter cabang)
      parameters:
        - name: location_id
          in: query
          description: Filter cabang khusus Superadmin (Admin cabang otomatis terkunci ke cabangnya)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar akun security cabang berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserListResponse'
        '403':
          description: Akses ditolak (hanya untuk Admin Cabang dan Superadmin)

    post:
      tags: [UserManagement]
      summary: Registrasi akun security baru oleh Admin Cabang atau Superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityUserRequest'
      responses:
        '201':
          description: Akun security berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Admin cabang mencoba mendaftarkan security untuk cabang lain

  /users/security/{id}/status:
    patch:
      tags: [UserManagement]
      summary: Ubah status aktif/nonaktif akun security cabang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status akun security berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '403':
          description: Admin cabang tidak berwenang mengelola security di luar cabangnya
        '404':
          description: Akun security tidak ditemukan

  /users/security/{id}:
    patch:
      tags: [UserManagement]
      summary: Ubah data akun security cabang — parsial + reset password (Superadmin semua cabang; Admin terkunci ke cabangnya)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityUserRequest'
      responses:
        '200':
          description: Data akun security berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityUserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (vendor/security dilarang; Admin lintas cabang dilarang)
        '404':
          description: Akun security tidak ditemukan (termasuk non-security)
        '409':
          description: Email sudah dipakai akun lain
    delete:
      tags: [UserManagement]
      summary: Hapus permanen akun security cabang (Superadmin semua cabang; Admin terkunci ke cabangnya)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Akun security dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (vendor/security dilarang; Admin lintas cabang dilarang)
        '404':
          description: Akun security tidak ditemukan (termasuk non-security)
        '409':
          description: Petugas masih memiliki kunjungan terkait

  # ============================================================
  # MASTER DATA (READ-ONLY FOR MVP)
  # ============================================================
  /locations:
    get:
      tags: [MasterData]
      summary: Daftar fasilitas lokasi (Cabang, POP, miniPOP) THC
      parameters:
        - name: active_only
          in: query
          description: true (default) hanya fasilitas aktif; false menyertakan nonaktif (halaman admin)
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Daftar fasilitas lokasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'

    post:
      tags: [MasterData]
      summary: Tambah fasilitas lokasi baru (Superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Fasilitas lokasi berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '409':
          description: Kantor Pusat sudah terdaftar. Hanya boleh ada satu Kantor Pusat.

  /locations/{id}:
    patch:
      tags: [MasterData]
      summary: Ubah parsial fasilitas lokasi / toggle aktif-nonaktif (Superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Fasilitas lokasi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Fasilitas lokasi tidak ditemukan
        '409':
          description: Kantor Pusat sudah terdaftar. Hanya boleh ada satu Kantor Pusat.

    delete:
      tags: [MasterData]
      summary: Hapus permanen fasilitas lokasi (Superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fasilitas lokasi dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Fasilitas lokasi tidak ditemukan
        '409':
          description: Fasilitas masih digunakan oleh kunjungan atau pengguna

  /users:
    get:
      tags: [UserManagement]
      summary: Daftar pengguna lintas cabang dengan filter peran/pencarian/cabang (Superadmin)
      parameters:
        - name: role
          in: query
          description: Filter peran (admin, vendor, security)
          schema:
            type: string
        - name: search
          in: query
          description: Pencarian nama atau email
          schema:
            type: string
        - name: location_id
          in: query
          description: Filter cabang penugasan
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          description: Akses ditolak (hanya untuk Superadmin)

    post:
      tags: [UserManagement]
      summary: Daftarkan akun admin cabang atau vendor baru (Superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUserRequest'
      responses:
        '201':
          description: Akun pengguna berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '409':
          description: Email sudah terdaftar

  /users/{id}:
    patch:
      tags: [UserManagement]
      summary: Ubah data akun pengguna — parsial, tanpa role/status (Superadmin; password = reset hash)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedUserRequest'
      responses:
        '200':
          description: Data akun pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid atau pasangan peran/lokasi dilanggar
        '401':
          description: Bukti password saat ini salah (khusus reset password akun sendiri)
        '403':
          description: Akses ditolak (hanya Superadmin; reset password super_admin lain dilarang)
        '404':
          description: Akun pengguna tidak ditemukan
        '409':
          description: Email sudah dipakai akun lain
    delete:
      tags: [UserManagement]
      summary: 'Hapus permanen akun pengguna (Superadmin; larangan: akun sendiri & super_admin)'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Akun pengguna dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya Superadmin; akun sendiri & super_admin dilarang)
        '404':
          description: Akun pengguna tidak ditemukan
        '409':
          description: Pengguna masih memiliki kunjungan terkait

  /users/{id}/status:
    patch:
      tags: [UserManagement]
      summary: 'Ubah status aktif/nonaktif akun pengguna (Superadmin; larangan: akun sendiri & super_admin)'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status akun pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Format data tidak valid
        '403':
          description: Akses ditolak (hanya Superadmin; akun sendiri & super_admin dilarang)
        '404':
          description: Akun pengguna tidak ditemukan

  /audit-logs:
    get:
      tags: [UserManagement]
      summary: Jejak audit lintas aksi (Superadmin; histori back-office, tanpa scoping cabang)
      parameters:
        - name: user_id
          in: query
          description: Filter pelaku (UUID pengguna); kosong = tanpa filter
          schema:
            type: string
            format: uuid
        - name: entity
          in: query
          description: Filter entitas (auth, user, location, visit); kosong = tanpa filter
          schema:
            type: string
        - name: action
          in: query
          description: Filter aksi (mis. user.create, visit.delete); kosong = tanpa filter
          schema:
            type: string
        - name: date_from
          in: query
          description: Batas bawah timestamp (inklusif). RFC3339 penuh atau date-only YYYY-MM-DD. Kosong = tanpa filter.
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Batas atas timestamp. RFC3339 diteruskan tepat; date-only YYYY-MM-DD mencakup sehari penuh. Kosong = tanpa filter.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Halaman jejak audit berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          description: Format filter tidak valid
        '403':
          description: Akses ditolak (hanya untuk Superadmin)

  /notifications:
    get:
      tags: [UserManagement]
      summary: Daftar notifikasi milik pengguna yang login (staff & vendor) beserta jumlah belum dibaca
      parameters:
        - name: location_id
          in: query
          description: Filter cabang (UUID); hanya Superadmin. Admin/Security terkunci ke cabang sendiri; vendor selalu hanya melihat notifikasinya sendiri.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Halaman notifikasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          description: Format filter tidak valid
        '403':
          description: Akses ditolak (role di luar empat peran VMS)

  /notifications/{id}:
    patch:
      tags: [UserManagement]
      summary: Tandai satu notifikasi milik sendiri sebagai sudah dibaca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationMarkReadRequest'
      responses:
        '200':
          description: Notifikasi berhasil ditandai sudah dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarkReadResponse'
        '400':
          description: ID notifikasi atau body permintaan tidak valid
        '404':
          description: Notifikasi tidak ditemukan atau bukan milik pengguna

  /notifications/read-all:
    post:
      tags: [UserManagement]
      summary: Tandai semua notifikasi milik sendiri sebagai sudah dibaca
      responses:
        '200':
          description: Jumlah notifikasi yang ditandai sudah dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'

  /purposes:
    get:
      tags: [MasterData]
      summary: Daftar opsi tujuan kunjungan (Survey, Maintenance, dll)
      responses:
        '200':
          description: Daftar opsi tujuan kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurposeListResponse'

  /vendors:
    get:
      tags: [MasterData]
      summary: Daftar vendor mitra (katalog dropdown relasi vendor)
      responses:
        '200':
          description: Daftar vendor mitra berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorListResponse'

  /jabatan:
    get:
      tags: [MasterData]
      summary: Daftar saran jabatan pengunjung yang pernah diisi (bukan katalog)
      description: >-
        Mengembalikan nilai `jabatan` distinct yang pernah tersimpan pada baris visitor,
        diurutkan A-Z dan dibatasi 50 entri. Nilai ini HANYA saran untuk combobox;
        pengguna tetap bebas mengetik jabatan baru dan nilai tersebut tidak divalidasi
        terhadap daftar ini.
      responses:
        '200':
          description: Daftar saran jabatan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JabatanListResponse'

  # ============================================================
  # OBJECT STORAGE & FILE UPLOAD (MINIO / S3)
  # ============================================================
  /uploads:
    post:
      tags: [Storage]
      summary: Unggah dokumen surat tugas (PDF/gambar) atau foto identitas ke MinIO/S3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                  description: File dokumen surat tugas (PDF/DOCX/PNG/JPG) atau foto identitas (maks 5MB)
                category:
                  type: string
                  enum: [assignment_letter, id_card, checkin_photo]
                  description: Kategori berkas untuk isolasi folder bucket MinIO
                owner_id:
                  type: string
                  deprecated: true
                  description: DEPRECATED dan DIABAIKAN oleh server. Server menurunkan segmen pemilik storage dari user terautentikasi (pending-<user_id>), sehingga nilai owner_id dari klien tidak pernah menentukan path objek. Diterima hanya agar klien lama tetap berfungsi.
      responses:
        '201':
          description: Berkas berhasil diunggah ke MinIO/S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
        '400':
          description: Format berkas tidak didukung atau ukuran melebihi batas 5MB
        '413':
          description: Ukuran file terlalu besar

  # ============================================================
  # VISITS CORE MANAGEMENT
  # ============================================================
  /visits:
    get:
      tags: [Visits]
      summary: Daftar seluruh kunjungan (Terfilter berdasarkan peran)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Pencarian bebas (ILIKE, kosong = tanpa filter) atas nama vendor, nama lokasi, nama vendor, nama teknisi (visitor), nama tujuan (purpose), dan Visit ID
          schema:
            type: string
        - name: date_from
          in: query
          description: Batas bawah window jadwal (inklusif, vr.start_date >= date_from). RFC3339 penuh (offset dipertahankan) atau date-only YYYY-MM-DD (midnight UTC). Kosong = tanpa filter.
          schema:
            type: string
            format: date-time
            example: '2026-10-01'
        - name: date_to
          in: query
          description: Batas atas window jadwal. RFC3339 diteruskan tepat (eksklusif, vr.start_date < date_to); date-only YYYY-MM-DD mencakup sehari penuh (inklusif, digeser +24 jam di backend). Range terbalik (date_from > date_to) ditolak 400 VALIDATION_ERROR. Hanya mempersempit dalam scoping peran, tak pernah melebarkan visibilitas.
          schema:
            type: string
            format: date-time
            example: '2026-10-03'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort_by
          in: query
          description: Kolom urutan (created_at, start_date, end_date). Default created_at. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [created_at, start_date, end_date]
            default: created_at
        - name: order
          in: query
          description: Arah urutan (asc, desc). Default desc. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'

    post:
      tags: [Visits]
      summary: Buat permohonan kunjungan baru (Vendor / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          description: Kunjungan berhasil diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'

  /visits/{id}:
    get:
      tags: [Visits]
      summary: Ambil rincian detail kunjungan (berdasarkan UUID atau Visit ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '404':
          description: Kunjungan tidak ditemukan
        '403':
          description: Di luar cakupan cabang (isolasi multi-branch AGENTS §6.1) — tanpa membocorkan data

    delete:
      tags: [Visits]
      summary: Hapus permanen kunjungan (Superadmin; status apa pun)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Kunjungan dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Kunjungan tidak ditemukan

  /visits/{id}/file:
    get:
      tags: [Visits]
      summary: Streaming satu slot berkas kunjungan (tahan tunnel, tanpa presigned URL)
      description: |
        Menyajikan isi satu slot berkas penyimpanan (surat tugas/SPK, foto KTP, atau selfie teknisi) sebagai aliran biner inline langsung dari backend, bukan URL presigned MinIO/S3. Endpoint ini dimiliki backend sepenuhnya (bukan proksi Next.js): URL presigned mengikat host storage pada tanda tangannya sehingga rusak saat dibuka lewat tunnel atau domain berbeda, sedangkan endpoint ini selalu lewat host API yang sama dengan aplikasi sehingga selamat melewati tunnel. Cakupan baca sama persis dengan `GET /visits/{id}`: global untuk super_admin, terkunci cabang untuk admin/security, dan milik sendiri untuk vendor (vendor lain dijawab 404 agar tidak membocorkan keberadaan data). Tidak ada migrasi maupun dependensi baru; URL presigned pada respons list/detail tidak berubah.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID kunjungan. Kode bisnis `VST-...` tidak diterima di sini (ID tidak valid → 400).
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [assignment_letter, id_card, selfie]
          description: Slot berkas yang disajikan. `assignment_letter` tinggal di baris kunjungan; `id_card`/`selfie` tinggal di baris tiap teknisi.
        - name: visitor_id
          in: query
          schema:
            type: string
            format: uuid
          description: UUID teknisi. Wajib untuk `id_card`/`selfie`; diabaikan untuk `assignment_letter`.
      responses:
        '200':
          description: "Isi berkas disajikan inline (`Content-Disposition: inline`, `Cache-Control: private, no-store`, `Pragma: no-cache`, `X-Content-Type-Options: nosniff`, `Accept-Ranges: bytes` beserta `Content-Length`)"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Potongan berkas untuk request `Range` (seek pratinjau; `Content-Range` menyertai respons)
        '400':
          description: ID/kind/visitor_id tidak valid (kode `VALIDATION_ERROR`, pesan Indonesia)
        '401':
          description: JWT tidak ada/tidak valid (kode `UNAUTHORIZED`)
        '403':
          description: Lintas cabang untuk admin/security (kode `FORBIDDEN_BRANCH`) — tanpa membocorkan data
        '404':
          description: Kunjungan tidak dikenal, slot kosong, teknisi tidak dikenal, atau milik vendor lain (kode `NOT_FOUND`, pesan "Berkas tidak tersedia." atau "Kunjungan tidak ditemukan.")
        '500':
          description: Gagal baca storage (kode `INTERNAL_ERROR`)

  /visits/{id}/approve:
    post:
      tags: [Visits]
      summary: Setujui permohonan kunjungan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Kunjungan disetujui (Status -> approved)

  /visits/{id}/reject:
    post:
      tags: [Visits]
      summary: Tolak permohonan kunjungan dengan alasan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Kunjungan ditolak (Status -> rejected)

  /visits/{id}/reschedule:
    post:
      tags: [Visits]
      summary: Penjadwalan ulang kunjungan (Vendor / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, reason]
              properties:
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '200':
          description: Kunjungan dijadwalkan ulang (Status -> rescheduled). Jadwal dapat digeser berulang kali, tetapi kunjungan harus disetujui kembali oleh admin sebelum check-in.

  /visits/{id}/cancel:
    post:
      tags: [Visits]
      summary: Batalkan kunjungan sebelum hari-H
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Kunjungan dibatalkan (Status -> cancelled)

  /visits/{id}/qr:
    get:
      tags: [Visits]
      summary: Dapatkan data payload QR Code untuk check-in gerbang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload QR Code berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      visit_id:
                        type: string
                      qr_code_payload:
                        type: string

  # ============================================================
  # SECURITY & BRANCH CHECK-IN / CHECK-OUT
  # ============================================================
  /visits/{id}/checkin:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-in tamu oleh Security, Admin Cabang, atau Superadmin (bypass lintas cabang saat darurat; Live Cam, Upload QR Galeri, atau Manual)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_url:
                  type: string
                badge_code:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Check-in berhasil (Status approved -> visiting; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '400':
          description: Di luar rentang toleransi waktu jadwal (±2 jam) atau QR tidak valid
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini

  /visits/{id}/checkout:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-out tamu saat selesai kunjungan (oleh Security, Admin Cabang, atau Superadmin bypass lintas cabang saat darurat)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check-out berhasil (Status -> completed; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini

  # ============================================================
  # PHASE 2 EXTENSION ENDPOINTS
  # ============================================================
  /visits/{id}/feedback:
    post:
      tags: [Phase2]
      summary: Kirim survey kepuasan pasca kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Feedback diterima

  /visits/{id}/incident:
    post:
      tags: [Phase2]
      summary: Lapor insiden darurat atau pelanggaran selama kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, severity]
              properties:
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high]
      responses:
        '201':
          description: Laporan insiden tercatat

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: healthy
            uptime:
              type: string
            timestamp:
              type: string
              format: date-time

    VisitStatus:
      type: string
      enum:
        - requested
        - approved
        - visiting
        - completed
        - not_visit
        - rejected
        - cancelled
        - rescheduled

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@thc.local
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT Access Token
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        nik:
          type: [string, "null"]
          pattern: ^\d{16}$
          description: NIK KTP tepat 16 digit angka; wajib untuk admin & vendor, null untuk security & super_admin (BE menolak NIK untuk keduanya)
        role:
          type: string
          enum: [super_admin, admin, security, vendor]
          example: admin
        location_id:
          type: [string, "null"]
          format: uuid
          description: ID cabang/POP penugasan (khusus admin & security, null untuk super_admin & vendor)
        location_name:
          type: [string, "null"]
          description: Nama fasilitas cabang/POP penugasan
        status:
          type: string
          enum: [active, inactive, blacklisted]
          example: active
        type:
          type: string
          enum: [internal, external]
        vendor_name:
          type: [string, "null"]
          description: Nama perusahaan vendor akun ini (override ketikan manual bila ada, kalau tidak nama katalog vendor; TIDAK terdaftar di katalog bila diketik manual dan TIDAK pernah tampil di dropdown vendor)

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    CreateSecurityUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: security.surabaya1@thc.local
        phone:
          type: string
          example: 081234567890
        password:
          type: string
          format: password
          example: Password123!
        location_id:
          type: string
          format: uuid
          description: Wajib untuk Superadmin. Diabaikan untuk Admin Cabang (otomatis disetel ke cabang admin).

    SecurityUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    SecurityUserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    UpdateSecurityUserRequest:
      type: object
      description: Parsial — member absen berarti biarkan kolom; password non-kosong me-reset hash baru
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
        password:
          type: string
          format: password
          description: Kosong/absen = biarkan; terisi = reset hash baru
        location_id:
          type: [string, "null"]
          format: uuid
          description: Cabang penugasan baru untuk akun security (mutasi lokasi). Absen/null = biarkan cabang saat ini (PATCH yang hanya berisi member ini tetap dianggap tanpa perubahan dan dijawab 400). Hanya Superadmin yang boleh mengisinya; Admin Cabang yang mengirim member ini mendapat 403.

    Location:
