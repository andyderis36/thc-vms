  # ============================================================
  # OBJECT STORAGE & FILE UPLOAD (MINIO / S3)
  # ============================================================
  /uploads:
    post:
      tags: [Storage]
      summary: Unggah dokumen surat tugas (PDF/gambar) atau foto identitas ke MinIO/S3
      description: |
        Kebijakan unggah DUA LANGKAH (`x-limits.upload_ingest_max_bytes` dan
        `x-limits.upload_stored_max_bytes`):

        1. Kompresi sebelum penyimpanan: gambar diperkecil hingga sisi terpanjang
           <= 1600 px lalu di-encode ulang (JPEG kualitas 82; PNG tetap PNG).
           Khusus `profile_photo`, gambar selalu dipusatkan lalu dipotong persegi
           dan disimpan sebagai JPEG kualitas 82 dengan sisi maksimum 512 px
           (orientasi EXIF diterapkan; area transparan menjadi putih).
           PDF yang lebih besar dari 5 MB dioptimasi (struktur, xref, resource
           duplikat) dan HANYA byte hasil optimasi yang disimpan; bila optimasi
           tidak memperkecil berkas, PDF asli TIDAK disimpan.
        2. Plafon PENYIMPANAN 5 MB (5242880 byte): bila hasil akhir setelah
           kompresi masih melebihi 5 MB, permintaan ditolak dengan HTTP 413
           `FILE_TOO_LARGE` dan tidak ada berkas yang disimpan.
        3. Plafon TRANSPORT 20 MB (20971520 byte, env `MAX_UPLOAD_INGEST_MB`):
           batas berkas mentah yang boleh dikirim klien sebelum kompresi.
        4. Respons 201 memuat `file_size` = jumlah byte yang benar-benar
           disimpan (hasil kompresi), bukan ukuran berkas mentah.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas PDF/JPG/PNG. Plafon transport 20MB untuk berkas mentah; hasil akhir setelah kompresi wajib <= 5MB.
                category:
                  type: string
                  enum: [assignment_letter, id_card, checkin_photo, profile_photo]
                  description: Kategori berkas untuk isolasi folder bucket MinIO. `profile_photo` hanya menerima `image/jpeg` dan `image/png`.
                owner_id:
                  type: string
                  deprecated: true
                  description: DEPRECATED dan DIABAIKAN oleh server. Server menurunkan segmen pemilik storage dari user terautentikasi (pending-<user_id>), sehingga nilai owner_id dari klien tidak pernah menentukan path objek. Diterima hanya agar klien lama tetap berfungsi.
      responses:
        '201':
          description: Berkas berhasil diunggah ke MinIO/S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
        '400':
          description: Format berkas tidak didukung (MIME di luar allow-list) atau berkas kosong (STORAGE_REJECTED)
        '413':
          description: Berkas melebihi plafon transport 20MB, atau hasil kompresi masih melebihi plafon penyimpanan 5MB (FILE_TOO_LARGE; tidak ada berkas tersimpan)

  # ============================================================
  # VISITS CORE MANAGEMENT
  # ============================================================
  /visits:
    get:
      tags: [Visits]
      summary: Daftar seluruh kunjungan (Terfilter berdasarkan peran)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Pencarian bebas (ILIKE, kosong = tanpa filter) atas nama vendor, nama lokasi, nama vendor, nama teknisi (visitor), nama tujuan (purpose), dan Visit ID
          schema:
            type: string
            maxLength: 100
        - name: date_from
          in: query
          description: Batas bawah window jadwal (inklusif, vr.start_date >= date_from). RFC3339 penuh (offset dipertahankan) atau date-only YYYY-MM-DD (midnight UTC). Kosong = tanpa filter.
          schema:
            type: string
            format: date-time
            example: '2026-10-01'
        - name: date_to
          in: query
          description: Batas atas window jadwal. RFC3339 diteruskan tepat (eksklusif, vr.start_date < date_to); date-only YYYY-MM-DD mencakup sehari penuh (inklusif, digeser +24 jam di backend). Range terbalik (date_from > date_to) ditolak 400 VALIDATION_ERROR. Hanya mempersempit dalam scoping peran, tak pernah melebarkan visibilitas.
          schema:
            type: string
            format: date-time
            example: '2026-10-03'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: sort_by
          in: query
          description: Kolom urutan (created_at, start_date, end_date). Default created_at. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [created_at, start_date, end_date]
            default: created_at
        - name: order
          in: query
          description: Arah urutan (asc, desc). Default desc. Nilai di luar kosakata ditolak 400 VALIDATION_ERROR.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'

    post:
      tags: [Visits]
      summary: Buat permohonan kunjungan baru (Vendor / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          description: Kunjungan berhasil diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, field wajib hilang, panjang/format melanggar x-limits). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. urutan jadwal, NDA belum diterima, purpose atau lokasi tidak dikenal, URL berbahaya). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}:
    get:
      tags: [Visits]
      summary: Ambil rincian detail kunjungan (berdasarkan UUID atau Visit ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail kunjungan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '404':
          description: Kunjungan tidak ditemukan
        '403':
          description: Di luar cakupan cabang (isolasi multi-branch AGENTS §6.1) — tanpa membocorkan data

    delete:
      tags: [Visits]
      summary: Hapus permanen kunjungan (Superadmin; status apa pun)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Kunjungan dihapus permanen (tanpa body)
        '403':
          description: Akses ditolak (hanya untuk Superadmin)
        '404':
          description: Kunjungan tidak ditemukan

  /visits/{id}/file:
    get:
      tags: [Visits]
      summary: Streaming satu slot berkas kunjungan (tahan tunnel, tanpa presigned URL)
      description: |
        Menyajikan isi satu slot berkas penyimpanan (surat tugas/SPK, foto KTP, atau selfie teknisi) sebagai aliran biner inline langsung dari backend, bukan URL presigned MinIO/S3. Endpoint ini dimiliki backend sepenuhnya (bukan proksi Next.js): URL presigned mengikat host storage pada tanda tangannya sehingga rusak saat dibuka lewat tunnel atau domain berbeda, sedangkan endpoint ini selalu lewat host API yang sama dengan aplikasi sehingga selamat melewati tunnel. Cakupan baca sama persis dengan `GET /visits/{id}`: global untuk super_admin, terkunci cabang untuk admin/security, dan milik sendiri untuk vendor (vendor lain dijawab 404 agar tidak membocorkan keberadaan data). Tidak ada migrasi maupun dependensi baru; URL presigned pada respons list/detail tidak berubah.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID kunjungan. Kode bisnis `VST-...` tidak diterima di sini (ID tidak valid → 400).
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [assignment_letter, id_card, selfie]
          description: Slot berkas yang disajikan. `assignment_letter` tinggal di baris kunjungan; `id_card`/`selfie` tinggal di baris tiap teknisi.
        - name: visitor_id
          in: query
          schema:
            type: string
            format: uuid
          description: UUID teknisi. Wajib untuk `id_card`/`selfie`; diabaikan untuk `assignment_letter`.
      responses:
        '200':
          description: "Isi berkas disajikan inline (`Content-Disposition: inline`, `Cache-Control: private, no-store`, `Pragma: no-cache`, `X-Content-Type-Options: nosniff`, `Accept-Ranges: bytes` beserta `Content-Length`)"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Potongan berkas untuk request `Range` (seek pratinjau; `Content-Range` menyertai respons)
        '400':
          description: ID/kind/visitor_id tidak valid (kode `VALIDATION_ERROR`, pesan Indonesia)
        '401':
          description: JWT tidak ada/tidak valid (kode `UNAUTHORIZED`)
        '403':
          description: Lintas cabang untuk admin/security (kode `FORBIDDEN_BRANCH`) — tanpa membocorkan data
        '404':
          description: Kunjungan tidak dikenal, slot kosong, teknisi tidak dikenal, atau milik vendor lain (kode `NOT_FOUND`, pesan "Berkas tidak tersedia." atau "Kunjungan tidak ditemukan.")
        '500':
          description: Gagal baca storage (kode `INTERNAL_ERROR`)

  /visits/{id}/approve:
    post:
      tags: [Visits]
      summary: Setujui permohonan kunjungan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan disetujui (Status -> approved)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, panjang catatan melanggar x-limits). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan tidak mengizinkan approve). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/reject:
    post:
      tags: [Visits]
      summary: Tolak permohonan kunjungan dengan alasan (THC Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan ditolak (Status -> rejected)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, alasan kurang dari 5 atau melebihi 1000 karakter). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan tidak mengizinkan reject). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/reschedule:
    post:
      tags: [Visits]
      summary: Penjadwalan ulang kunjungan (Vendor / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, reason]
              properties:
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan dijadwalkan ulang (Status -> rescheduled). Jadwal dapat digeser berulang kali, tetapi kunjungan harus disetujui kembali oleh admin sebelum check-in.
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, field wajib hilang, alasan melebihi 1000 karakter, tanggal tidak berformat date-time). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. start_date setelah end_date, jadwal sudah lewat). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/cancel:
    post:
      tags: [Visits]
      summary: Batalkan kunjungan sebelum hari-H
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Kunjungan dibatalkan (Status -> cancelled)
        '400':
          description: 'Validasi lapisan HTTP gagal (body JSON rusak atau tidak valid, alasan melebihi 1000 karakter). Amplop galat: { success: false, error: { code, message } }.'
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. pembatalan melewati batas hari-H). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/qr:
    get:
      tags: [Visits]
      summary: Dapatkan data payload QR Code untuk check-in gerbang
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payload QR Code berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      visit_id:
                        type: string
                      qr_code_payload:
                        type: string

  # ============================================================
  # SECURITY & BRANCH CHECK-IN / CHECK-OUT
  # ============================================================
  /visits/{id}/checkin:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-in tamu oleh Security, Admin Cabang, atau Superadmin (bypass lintas cabang saat darurat; Live Cam, Upload QR Galeri, atau Manual)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_url:
                  type: string
                badge_code:
                  type: string
                  maxLength: 64
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Check-in berhasil (Status approved -> visiting; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '400':
          description: Di luar rentang toleransi waktu jadwal (±2 jam) atau QR tidak valid
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini
        '413':
          description: 'Ukuran body JSON melebihi 1 MiB (1048576 byte). Amplop galat: { success: false, error: { code, message } }.'
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan bukan approved). Amplop galat: { success: false, error: { code, message } }.'

  /visits/{id}/checkout:
    post:
      tags: [SecurityGate]
      summary: Eksekusi check-out tamu saat selesai kunjungan (oleh Security, Admin Cabang, atau Superadmin bypass lintas cabang saat darurat)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check-out berhasil (Status -> completed; dicatat atas id pelaksana, superadmin lintas cabang saat darurat)
        '400':
          description: 'Validasi lapisan HTTP gagal (ID kunjungan tidak valid). Amplop galat: { success: false, error: { code, message } }.'
        '403':
          description: Petugas tidak berwenang mengelola cabang kunjungan ini
        '422':
          description: 'Validasi semantik usecase gagal (mis. status kunjungan bukan visiting). Amplop galat: { success: false, error: { code, message } }.'

  # ============================================================
  # PHASE 2 EXTENSION ENDPOINTS
  # ============================================================
  /visits/{id}/feedback:
    post:
      tags: [Phase2]
      summary: Kirim survey kepuasan pasca kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Feedback diterima

  /visits/{id}/incident:
    post:
      tags: [Phase2]
      summary: Lapor insiden darurat atau pelanggaran selama kunjungan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, severity]
              properties:
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high]
      responses:
        '201':
          description: Laporan insiden tercatat

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: healthy
            uptime:
              type: string
            timestamp:
              type: string
              format: date-time

    VisitStatus:
      type: string
      enum:
        - requested
        - approved
        - visiting
        - completed
        - not_visit
        - rejected
        - cancelled
        - rescheduled

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@transhybrid.net.id
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT Access Token
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: "^(?:62|0)[0-9]{9,15}$"
          maxLength: 16
        nik:
          type: [string, "null"]
          pattern: ^\d{16}$
          description: NIK KTP tepat 16 digit angka; wajib untuk admin & vendor, null untuk security & super_admin (BE menolak NIK untuk keduanya)
        role:
          type: string
          enum: [super_admin, admin, security, vendor]
          example: admin
        location_id:
          type: [string, "null"]
          format: uuid
          description: ID cabang/POP penugasan (khusus admin & security, null untuk super_admin & vendor)
        location_name:
          type: [string, "null"]
          description: Nama fasilitas cabang/POP penugasan
        status:
          type: string
          enum: [active, inactive, pending, blacklisted]
          example: active
        type:
          type: string
          enum: [internal, external]
        vendor_name:
          type: [string, "null"]
          maxLength: 120
          description: Nama perusahaan vendor akun ini (override ketikan manual bila ada, kalau tidak nama katalog vendor; TIDAK terdaftar di katalog bila diketik manual dan TIDAK pernah tampil di dropdown vendor)
        avatar_url:
          type: [string, "null"]
          maxLength: 2048
          description: Path API host-agnostic `/api/v1/avatars/{id}?v=...` yang isinya dialirkan oleh `GET /avatars/{id}` (bukan URL storage); `v` adalah versi cache yang berubah saat foto diunggah ulang. Null bila belum ada foto profil. URL bucket mentah tidak pernah diekspos.
        editable_fields:
          type: array
          items:
            type: string
            enum: [name, phone, avatar_url]
          description: Daftar field yang boleh diubah sendiri oleh pemanggil, dihitung dari peran pemanggil; hanya dijamin ada pada respons `/auth/me`.

